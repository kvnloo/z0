name: cla

# Owner decision O-3: outside contributions come in under the CLA in CLA.md.
# Safety: pull_request_target runs this file from the base branch and never checks
# out or executes PR code. Signatures are committed to the unprotected
# `cla-signatures` branch because the default branch's ruleset rejects bot pushes.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/kvnloo/z0/blob/main/CLA.md
          branch: cla-signatures
          allowlist: kvnloo,*[bot]
