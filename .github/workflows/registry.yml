name: registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ./scripts/registry-check
      - run: ./scripts/docs-generate
      - run: ./scripts/cognition-check
      - run: git diff --exit-code generated/ docs/reference/
