name: registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # One gate: structural validation, regeneration, and drift across every
      # generated surface (generated/, docs/components/, ownership.md,
      # zer0.registry.yaml).
      - run: ./scripts/docs-check
