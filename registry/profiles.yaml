# Install profiles — resolved component sets, not a package manager.

profiles:
  minimal:
    summary: OMP only — the coding agent runtime.
    components:
      - oh-my-pi

  core:
    summary: Normal Zer0 user — agent + measurement.
    components:
      - oh-my-pi
      - tokenomics

  personal:
    summary: Personalization and learned policy.
    extends: core
    components:
      - z0intelligence

  desktop:
    summary: Predictive desktop + Handsfree voice (OMP subsystems).
    extends: core
    components:
      - flow

  compute:
    summary: Model/provider routing and cost optimization.
    extends: core
    components:
      - kerdoios

  research:
    summary: Autonomous optimization and research knowledge.
    components:
      - z0intelligence
      - tokenomics
      - evolution-lab
      - frontier-kb

  full:
    summary: Every installable component, including shadow ones (flow, evolution-lab, frontier-kb, aodl); excludes idea/reference-only.
    components:
      - oh-my-pi
      - tokenomics
      - z0intelligence
      - flow
      - kerdoios
      - evolution-lab
      - frontier-kb
      - aodl
      - agenttrace

# Onboarding target policy (design §2.2, owner decision D-3). Profile membership is
# unchanged: `./z0 onboard --auto` targets the hardware-default profile plus these
# supplementals, each gated by its own `onboard:` block. `--without` removes any of them.
onboard:
  auto_supplementals: [dash, z0evals]
  # §8.1: install order hint; `*` stands for every other component. depends_on and
  # step `needs` edges always win over this hint (law O1).
  order: [tokenomics, z0intelligence, oh-my-pi, "*", dash, z0evals]
