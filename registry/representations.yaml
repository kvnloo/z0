# Information representations flowing through Zer0.
# These are semantic forms of information, not storage engines or installable components.
# The purpose is to make information compression, retrieval, and decision boundaries visible.

representations:
  raw-context:
    name: Raw context
    kind: source
    scale: large
    summary: Uncompressed source text, logs, files, observations, or conversation state.
    sensitivity: inherited
    evidence:
      - kvnloo/oh-my-pi:README.md
      - kvnloo/SoL-Pi:README.md

  rlm-address:
    name: RLM address
    kind: address
    scale: tiny
    summary: Stable handle that keeps large context externally addressable instead of replaying it into the frontier window.
    sensitivity: inherited
    produced_by: [rlm-context-spill]
    evidence:
      - registry/mechanisms.yaml#mechanisms.rlm-context-spill

  observation-pack:
    name: ObservationPack
    kind: evidence_bundle
    scale: bounded
    summary: Stable compact handle plus exact recall path for large observations.
    sensitivity: inherited
    produced_by: [sol-pi-observation-pack]
    evidence:
      - registry/mechanisms.yaml#mechanisms.sol-pi-observation-pack

  evidence-receipt:
    name: Evidence receipt
    kind: evidence_bundle
    scale: compact
    summary: Quote-verifiable compressed diagnostic evidence with a fall-open path when verification fails.
    sensitivity: inherited
    produced_by: [sol-pi-evidence-reducer]
    evidence:
      - registry/mechanisms.yaml#mechanisms.sol-pi-evidence-reducer

  compiled-decision-state:
    name: Compiled decision state
    kind: decision_state
    scale: compact
    summary: Decision-relevant state after retrieval, filtering, and bounded context compilation.
    sensitivity: inherited
    evidence:
      - kvnloo/z0intelligence:README.md
      - kvnloo/oh-my-pi:README.md

  aodl-intent:
    name: AODL intent
    kind: intent
    scale: compact
    summary: Typed desired orchestration before runtime-safe compilation.
    sensitivity: inherited
    interface: aodl.intent.v1
    evidence:
      - registry/interfaces.yaml#interfaces.aodl.intent.v1

  compiled-plan:
    name: Compiled orchestration plan
    kind: plan
    scale: compact
    summary: Runtime-safe plan compiled from typed intent before execution.
    sensitivity: inherited
    produced_by: [aodl-intent-plan-observed]
    evidence:
      - registry/mechanisms.yaml#mechanisms.aodl-intent-plan-observed

  observed-topology:
    name: Observed execution topology
    kind: observation
    scale: bounded
    summary: What actually ran, kept distinct from desired intent and compiled plan.
    sensitivity: inherited
    produced_by: [aodl-intent-plan-observed, agenttrace-cross-harness-observation]
    evidence:
      - registry/mechanisms.yaml#mechanisms.aodl-intent-plan-observed
      - registry/mechanisms.yaml#mechanisms.agenttrace-cross-harness-observation

  decision-receipt:
    name: Decision receipt
    kind: decision
    scale: tiny
    summary: Structured audit record of a routing or policy decision.
    sensitivity: inherited
    interface: z0int.decision_receipt.v1
    evidence:
      - registry/interfaces.yaml#interfaces.z0int.decision_receipt.v1

  trace-span:
    name: Agent trace span
    kind: observation
    scale: small
    summary: Historical normalized execution span for cross-harness observability.
    sensitivity: inherited
    interface: agenttrace.span.v0
    evidence:
      - registry/interfaces.yaml#interfaces.agenttrace.span.v0

  tokenomics-event:
    name: Tokenomics event
    kind: measurement
    scale: small
    summary: Vendor-neutral token, cost, latency, and execution measurement envelope.
    sensitivity: inherited
    interface: tokenomics.event.v0
    evidence:
      - registry/interfaces.yaml#interfaces.tokenomics.event.v0

  lossless-context-node:
    name: Lossless context DAG node
    kind: memory
    scale: bounded
    summary: Recoverable raw-message or hierarchical summary node with explicit source lineage and drill-down.
    sensitivity: inherited
    produced_by: [hermes-lossless-context-dag]
    evidence:
      - registry/mechanisms.yaml#mechanisms.hermes-lossless-context-dag

  signed-mesh-intent:
    name: Signed Mesh intent
    kind: intent
    scale: compact
    summary: Versioned bounded execution intent carrying task revision, capability/policy hashes, privacy class, replay controls, and signature.
    sensitivity: inherited
    produced_by: [mesh-signed-intent-transport]
    evidence:
      - registry/mechanisms.yaml#mechanisms.mesh-signed-intent-transport

  privilege-grant:
    name: Privilege grant
    kind: authorization
    scale: tiny
    summary: One-use monotonic-TTL authorization bound to an immutable approved privileged-operation digest.
    sensitivity: private
    produced_by: [split-authority-privilege-broker]
    evidence:
      - registry/mechanisms.yaml#mechanisms.split-authority-privilege-broker

  model-passport:
    name: Model passport
    kind: metadata
    scale: small
    summary: Portable descriptor separating maker, canonical model identity, verified capabilities/lifecycle, and serving route.
    sensitivity: public
    produced_by: [model-passport-identity]
    evidence:
      - registry/mechanisms.yaml#mechanisms.model-passport-identity

  evaluation-artifact:
    name: Frozen evaluation artifact
    kind: evidence
    scale: bounded
    summary: Pinned reproducible study data, analysis, figure, or report whose public claim resolves to frozen evidence.
    sensitivity: public
    produced_by: [frozen-eval-publication]
    evidence:
      - registry/mechanisms.yaml#mechanisms.frozen-eval-publication

  architecture-snapshot:
    name: Architecture snapshot
    kind: world_state
    scale: large
    summary: Content-addressed semantic architecture state that can be replayed, compared, or forked without mutating canonical truth.
    sensitivity: public
    produced_by: [z0archy-history-fork-diff]
    evidence:
      - registry/mechanisms.yaml#mechanisms.z0archy-history-fork-diff

  semantic-compression-receipt:
    name: Semantic compression receipt
    kind: evidence_bundle
    scale: compact
    summary: Audit of a compressed architecture view recording retained/hidden structure, cut relations, provenance, and high-relevance omissions.
    sensitivity: inherited
    produced_by: [z0archy-semantic-compression]
    evidence:
      - registry/mechanisms.yaml#mechanisms.z0archy-semantic-compression

  hierarchy-proposal:
    name: Architecture hierarchy proposal
    kind: proposal
    scale: compact
    summary: Evidence-backed keep, merge, split, prune, or no-update suggestion derived from architecture history without changing canonical ontology.
    sensitivity: public
    produced_by: [z0archy-hierarchy-meta-learning]
    evidence:
      - registry/mechanisms.yaml#mechanisms.z0archy-hierarchy-meta-learning
