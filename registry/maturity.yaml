# Canonical Zer0 component maturity vocabulary.
# status = artifact maturity; execution = rollout mode (orthogonal).

status:
  idea: Concept or design note only; no install target.
  prototype: Works in demos; APIs unstable; may lack tests.
  experimental: Usable with caveats; breaking changes likely.
  canary: Default for active integration branches; dogfooded internally.
  stable: Semver-ish stability; documented upgrade path.
  deprecated: Still present; do not start new work here.
  reference: Illustrative or historical; not a product surface.

execution:
  shadow: Emits side-channel telemetry only; no user-visible effect.
  log_only: Records decisions; does not act on them.
  canary: Partial live path; gated or opt-in.
  live: Default production path when installed.

# EFFECTS. The vocabulary that `may_influence` and `must_not` are written in.
#
# Every entry says what the effect IS (`means`) and what it is allowed to touch
# (`authorizes`). Until 2026-09-22 these terms existed only inside the evidence
# table below: no definition, no code reference, no check. The taxonomy's
# central rule -- "CONFIRM is the only class that may establish capability
# trust" -- was therefore unenforceable prose, and prose is where the classes
# disagreed: SMOKE's `must_not` said "any capability claim, trust record, routing
# change" while every other class used terms. A typo, or a class inventing a new
# effect, changed the policy silently.
#
# `scripts/registry-check` now requires that every term used in `may_influence`
# or `must_not` appears here, that no class lists the same term in both, and
# that no effect is declared and then never used.
#
# One asymmetry is deliberate and worth stating: a RESTRICTION may be asserted on
# the weakest evidence, while a PERMISSION requires the strongest. Quarantining a
# capability because a smoke test segfaulted is allowed at SMOKE; granting it
# production trust is not allowed below CONFIRM.
effects:
  tested_observation:
    means: >
      Record that this capability was measured on real inputs, with no verdict
      about whether the result is good enough to act on. It is bookkeeping, not
      a grant: it says a measurement exists and says nothing about whether the
      capability works.
    authorizes: a Status.TESTED row and a trust verdict that permits nothing
  hypothesis_formation:
    means: Decide what to investigate next.
    authorizes: nothing persisted
  next_experiment_design:
    means: Change the design, sample, or split of the next experiment.
    authorizes: nothing persisted
  operational_confidence:
    means: Raise or lower a human operator's confidence in running the system.
    authorizes: nothing persisted
  rollout_risk_estimate:
    means: Feed an estimate of how risky a rollout would be.
    authorizes: rollout risk notes
  shadow_trust_record:
    means: >
      A per-(model, capability) verdict valid only for shadow or observation
      paths. It may influence whether something is watched; it may never gate a
      production path.
    authorizes: the shadow tier of a capability trust record
  capability_trust_record:
    means: >
      A per-(model, capability) verdict that permits a PRODUCTION path. This is
      the only verdict that may authorize production, and it is capability
      specific: trust in one capability never implies trust in another.
    authorizes: the production tier of a capability trust record, and production routing
  production_gate:
    means: Turn a production path on or off.
    authorizes: default routing, install profile membership
  general_trust_record:
    means: >
      A per-(model, capability) verdict that permits a production path BEYOND
      the distribution the capability was measured on. A generality claim in
      trust form, so only out-of-distribution evidence may establish it.
    authorizes: the general tier of a capability trust record
  comparison_claims:
    means: Assert that condition A differs from condition B with the pairing preserved.
    authorizes: a comparative claim
  marginal_gain_claims:
    means: Assert how much a change adds over a baseline.
    authorizes: a marginal-gain claim
  generality_claims:
    means: Assert the result holds beyond the distribution that was measured.
    authorizes: a generality claim
  regression_evidence:
    means: Serve as evidence that a change did not break a previously working path.
    authorizes: regression gate evidence
  published_claim:
    means: Appear in a published, externally visible, or certified result.
    authorizes: z0evals publication
  default_routing:
    means: Change which backend the default path selects.
    authorizes: routing configuration
  selection:
    means: Choose a candidate, arm, or model between alternatives.
    authorizes: experiment selection
  tuning:
    means: Fit or adjust parameters.
    authorizes: model or policy parameters
  install_profile_membership:
    means: Add or remove an entity from an install profile.
    authorizes: an install profile
  any_capability_claim:
    means: Any statement that a model can do something.
    authorizes: nothing; forbids the whole class of statements
  retroactive_trust_for_other_capabilities:
    means: Let evidence about one capability raise trust in a different one.
    authorizes: nothing

# TRUST. The verdict vocabulary for a capability trust record -- what a claim
# about a (model, capability) has EARNED, as opposed to `evidence:` above, which
# is how strong the claim is. The `capability_trust_record` effect above names
# "the production tier of a capability trust record"; this is that record's
# value set, which was otherwise undeclared and spelled differently in the two
# repos that keep one.
#
#   permits  the strongest path this verdict may gate. `nothing` means the
#            verdict records state and authorizes no path.
#   requires the effect (from `effects:` above) an evidence class must hold to
#            establish it. Empty means it needs no evidence at all: either it
#            asserts nothing, or it is a restriction, and a restriction may rest
#            on the weakest evidence.
#
# SPELLING follows `evidence:` exactly -- canonical uppercase here, lowercased on
# disk (`"status": "trusted_bounded"`). Aliases are the names other repos already
# wrote; they map onto these values and are not a second set.
#
# Two distinctions the values exist to keep:
#   * `EXPERIMENTAL` is not `TESTED_EXPERIMENTAL`. The first means somebody ran
#     it informally and no artifact says how; the second means there is a
#     measurement and it does not yet license action. Collapsing them would
#     either invent evidence or discard it.
#   * `TRUSTED_BOUNDED` is not `TRUSTED_GENERAL`. Bounded permits a production
#     path inside the measured distribution; general permits one outside it, and
#     only out-of-distribution evidence may establish it.
#
# A trust name or alias may NOT collide with an evidence class name. One did:
# `exploratory_beta` was a trust status here and an evidence class next door, so
# the same token in two files meant two different things. It is deliberately not
# kept as an alias -- mapping it silently would be guessing which of the two it
# meant, and the only record that used it was migrated instead. `registry-check`
# now fails on any overlap in either direction.
trust:
  UNTESTED:
    means: No measurement exists for this (model, capability).
    permits: nothing
    requires: []
  EXPERIMENTAL:
    means: >
      Exercised informally; no artifact records how. A scratchpad state, never a
      claim -- if there is no measurement to cite, this is the ceiling.
    permits: nothing
    requires: []
  TESTED_EXPERIMENTAL:
    means: >
      Measured on real inputs and an artifact is cited. The result does not yet
      license acting on it.
    permits: nothing
    requires: [tested_observation]
  TRUSTED_SHADOW:
    means: Permitted on shadow or observation paths only, never production.
    permits: shadow
    requires: [shadow_trust_record]
  TRUSTED_BOUNDED:
    means: >
      Permitted on a production path for this capability, within the measured
      distribution.
    permits: production
    requires: [capability_trust_record]
  TRUSTED_GENERAL:
    means: >
      Permitted on a production path beyond the measured distribution. A
      generality claim in trust form, so only OOD evidence may establish it.
    permits: general
    requires: [general_trust_record]
  QUARANTINED:
    means: >
      Withdrawn because a measurement showed an unsafe or harmful result. A
      restriction, not a claim, which is why it may be established on the
      weakest evidence.
    permits: nothing
    requires: []
  DEPRECATED:
    means: The checkpoint this verdict was about is no longer the current one.
    permits: nothing
    requires: []
    aliases: [rejected_for_current_checkpoint]
  NOT_APPLICABLE:
    means: >
      The capability is not meaningful for this model -- for example a backend
      that does not expose it at all.
    permits: nothing
    requires: []

# Canonical evidence classification for any claim about a model capability.
#
# This is the single definition. Repos REFERENCE it; they must not redeclare
# their own vocabulary. Before 2026-09-22 the ecosystem carried six or seven
# disjoint lists (z0intelligence trust statuses and promotion states, kerdoios
# Trust/Status/EvidenceClass, evolution-lab keep|discard and L0-L3, z0evals
# draft|frozen|published|superseded, and these maturity keys), which could not
# be joined. `PAIRED_REPLAY` existed nowhere.
#
# `may_influence` is the strongest thing a claim at this class is ALLOWED to
# change. A claim may never borrow the consequences of a stronger class, and
# absence of evidence is not a weak class -- it is no class. Both lists draw
# their terms from `effects:` above and are checked against it.
#
# SPELLING. The keys below are canonical and uppercase. Artifacts on disk
# serialize the class as the SAME NAME LOWERCASED -- `EXPLORATORY_BETA` is
# written `"evidence_class": "exploratory_beta"`. That is a serialization rule,
# not a second vocabulary: there is exactly one set of classes. Every consumer
# normalizes case before matching. This was a real integration break: 17
# artifacts in this ecosystem carried the lowercase spelling while the only
# consumer matched uppercase literals exactly, so it rejected every artifact it
# was handed with "unknown evidence_class". Consumers use
# `z0.registry.normalize_evidence_class` (or an equivalent mirror of it) rather
# than comparing strings directly.
#
# `CORPUS` is deliberately NOT a class. A corpus is a dataset, not a claim about
# a capability; it has no place on a strength ladder and must not be ranked
# against CONFIRM. Corpus manifests label themselves with `artifact_kind`.
#
# All seven classes are required; `scripts/registry-check` fails if one is
# missing or if a class omits `means` or `may_influence`.

evidence:
  SMOKE:
    means: >
      The path runs end to end at least once on a trivial or synthetic input.
      Proves wiring and nothing else.
    may_influence: []
    must_not: [any_capability_claim, capability_trust_record, shadow_trust_record, default_routing, published_claim]

  EXPLORATORY_BETA:
    means: >
      Real inputs, small n, no paired control. A direction to investigate, not
      a result.
    may_influence: [tested_observation, hypothesis_formation, next_experiment_design]
    must_not: [capability_trust_record, shadow_trust_record, default_routing, published_claim]

  SHADOW:
    means: >
      Runs on live traffic without affecting the outcome, recording what it
      would have done. Observational only.
    may_influence: [tested_observation, operational_confidence, rollout_risk_estimate, shadow_trust_record]
    must_not: [capability_trust_record, default_routing]

  PAIRED_REPLAY:
    means: >
      The same inputs scored under two conditions with the pairing preserved, so
      the difference is attributable to the condition rather than to sampling.
      Required before any comparative or marginal-gain claim.
    may_influence: [tested_observation, comparison_claims, marginal_gain_claims]
    must_not: [capability_trust_record]

  CONFIRM:
    means: >
      Frozen split, pre-registered metric, no further tuning, reproduction
      attempted. The only class that may establish capability trust.
    may_influence: [capability_trust_record, production_gate]
    must_not: [generality_claims]

  OOD:
    means: >
      Out-of-distribution or protected slice, held out from all selection and
      tuning. The only class that may support a generality claim.
    may_influence: [general_trust_record, generality_claims, regression_evidence]
    must_not: [selection, tuning]

  PROMOTION:
    means: >
      The artefact is the governed default path, with an activation record
      naming what changed and how to revert. A promotion consumes CONFIRM and
      OOD evidence; it does not substitute for it.
    may_influence: [default_routing, install_profile_membership]
    must_not: [retroactive_trust_for_other_capabilities]
