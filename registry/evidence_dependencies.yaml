# EvidenceDependency edges explain why a semantic relationship is believed.
# Endpoint syntax is "<kind>:<id>" where kind is component, harness, mechanism,
# interface, lifecycle, representation, or repo.
#
# These edges are deliberately epistemic. They do not replace ordinary dependency
# or data-flow edges; they attach the retrieval recipe, invariants and invalidators
# needed to verify a claim about the architecture.

evidence_dependencies:
  hermes-bend-proof-evidence:
    from: harness:hermes
    to: repo:kvnloo/bend
    relation: uses_verifier
    required_evidence:
      - https://github.com/kvnloo/bend-native/blob/7b891019204ee10b88e78ef142ec00c3db5fe36a/README.md
      - https://github.com/kvnloo/bend-native/blob/7b891019204ee10b88e78ef142ec00c3db5fe36a/plugin.yaml
      - https://github.com/kvnloo/hermes-agent/issues/324
      - https://github.com/kvnloo/hermes-agent/issues/389
    invariants:
      - The standalone native plugin uses the public Hermes API; Hermes retains execution ownership.
      - Receipts identify captured inputs, cached dependencies, the Bend installation and the private kernel.
      - A Bend verdict covers the emitted book, not source equivalence, task success or an execution grant.
      - The standalone plugin lives in kvnloo/bend-native; use the exact evidence SHA.
    invalidators:
      - A source, dependency, runtime or kernel identity changes without invalidating the receipt.
      - A consumer interprets a raw Bend pass as AODL admission or whole-task verified success.
    retrieval:
      fastest: pinned-plugin-receipt
      fallback: pinned-source-revision
    confidence: declared
    abstain_if:
      - The claim requires source semantics and the selected compiler has no corresponding qualification evidence.

  z0int-bend-specification-check:
    from: component:z0intelligence
    to: repo:kvnloo/bend
    relation: checks_specification_with
    required_evidence:
      - https://github.com/kvnloo/z0intelligence/issues/48
      - https://github.com/kvnloo/z0intelligence/blob/a0e95785fe810ae0d1cfbb128096b5deca5c2712/bend/aodl_gate/README.md
      - https://github.com/kvnloo/bend-native/blob/7b891019204ee10b88e78ef142ec00c3db5fe36a/scripts/smoke.py
    invariants:
      - AODL owns the contract and canonical Python validation remains the admission authority.
      - Bend is an experimental specification and CI verifier; measured parity does not prove equivalence.
      - Verifier artifacts join existing decision and outcome evidence rather than defining another credit protocol.
    invalidators:
      - Bend is promoted onto the admission hot path without new equivalence and benefit evidence.
      - Proof success is treated as evidence for rules absent from the stated laws.
    retrieval:
      fastest: pinned-experiment-report
      fallback: source-search
    confidence: declared

  omp-rlm-context-spill:
    from: component:oh-my-pi
    to: mechanism:rlm-context-spill
    relation: implements
    required_evidence:
      - kvnloo/oh-my-pi:README.md
      - registry/components.yaml#components.oh-my-pi
    invariants:
      - Large context remains externally addressable rather than being irreversibly discarded.
      - The coding-agent runtime remains authoritative for execution.
    invalidators:
      - RLM/context-spill implementation is removed from OMP.
      - The mechanism moves to another authoritative runtime without the registry being updated.
    retrieval:
      fastest: repo-doc
      fallback: source-search
    confidence: declared
    abstain_if:
      - selected implementation ref cannot provide either architecture documentation or source evidence.

  observation-pack-compresses-context:
    from: representation:raw-context
    to: representation:observation-pack
    relation: compresses_to
    via: mechanism:sol-pi-observation-pack
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.sol-pi-observation-pack
    invariants:
      - Original observation remains exactly recallable through the stable handle.
    invalidators:
      - Compaction destroys exact recall.
    retrieval:
      fastest: registry
      fallback: implementation-doc
    confidence: declared

  evidence-reducer-preserves-verifiability:
    from: representation:raw-context
    to: representation:evidence-receipt
    relation: compresses_to
    via: mechanism:sol-pi-evidence-reducer
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.sol-pi-evidence-reducer
    invariants:
      - Compressed evidence remains quote-verifiable.
      - Verification failure falls open rather than silently inventing evidence.
    invalidators:
      - Verification failure is accepted as valid compressed evidence.
    retrieval:
      fastest: implementation-doc
      fallback: source-search
    confidence: declared

  aodl-intent-to-plan:
    from: representation:aodl-intent
    to: representation:compiled-plan
    relation: compiles_to
    via: mechanism:aodl-intent-plan-observed
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.aodl-intent-plan-observed
      - registry/interfaces.yaml#interfaces.aodl.intent.v1
    invariants:
      - Desired intent and runtime-safe plan remain distinguishable.
    invalidators:
      - Runtime executes an uncompiled intent while claiming compiled-plan semantics.
    retrieval:
      fastest: registry
      fallback: implementation-doc
    confidence: declared

  plan-to-observed-topology:
    from: representation:compiled-plan
    to: representation:observed-topology
    relation: observed_as
    via: mechanism:aodl-intent-plan-observed
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.aodl-intent-plan-observed
      - registry/mechanisms.yaml#mechanisms.agenttrace-cross-harness-observation
    invariants:
      - Observed execution remains distinguishable from intended execution.
      - Missing trace evidence is represented as missing, not synthesized.
    invalidators:
      - Observed topology is inferred without trace/runtime evidence and presented as fact.
    retrieval:
      fastest: trace
      fallback: harness-log
    confidence: declared

  unified-memory-preserves-provenance:
    from: representation:raw-context
    to: representation:context-packet
    relation: resolves_to
    via: mechanism:unified-memory-evidence-path
    required_evidence:
      - kvnloo/z0intelligence:src/z0int/context_resolve.py
      - kvnloo/z0evals:studies/unified-memory-v0/README.md
    invariants:
      - Carried evidence remains attributable by source id, version, locator, and trust class.
      - Contradictions and missing required evidence remain explicit instead of inventing a winner.
      - Retrieval, model-visible injection, answer support, and verification remain distinct stages.
    invalidators:
      - A context packet carries unsupported claims while hiding an unresolved gap.
      - A configured index is treated as proof of model-visible or answer-supported memory.
    retrieval:
      fastest: context-resolve-packet
      fallback: original-source
    confidence: declared
    abstain_if:
      - provenance required by the question cannot be reconstructed from the selected sources.

  decision-state-to-receipt:
    from: representation:compiled-decision-state
    to: representation:decision-receipt
    relation: decides_to
    via: mechanism:jev-typed-decision
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.jev-typed-decision
      - registry/interfaces.yaml#interfaces.z0int.decision_receipt.v1
    invariants:
      - Decision space is explicit and bounded before typed scoring/readout.
      - Receipt identifies enough context to audit the decision.
    invalidators:
      - Free-form generation substitutes for the bounded decision while retaining the same semantic label.
    retrieval:
      fastest: decision-receipt
      fallback: implementation-doc
    confidence: declared

  execution-to-tokenomics:
    from: representation:observed-topology
    to: representation:tokenomics-event
    relation: measured_as
    required_evidence:
      - registry/interfaces.yaml#interfaces.tokenomics.event.v0
      - registry/mechanisms.yaml#mechanisms.agenttrace-cross-harness-observation
    invariants:
      - Cost/token/latency claims come from measurement evidence rather than architecture inference.
    invalidators:
      - Economic metrics are reconstructed solely from model/provider assumptions.
    retrieval:
      fastest: tokenomics-event
      fallback: reconciliation-report
    confidence: declared

  lossless-context-preserves-drilldown:
    from: representation:raw-context
    to: representation:lossless-context-node
    relation: compacts_to
    via: mechanism:hermes-lossless-context-dag
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.hermes-lossless-context-dag
      - kvnloo/hermes-lcm:README.md#what-it-does
    invariants:
      - Raw messages remain recoverable after active-context compaction.
      - Summary nodes retain source lineage and bounded drill-down paths.
    invalidators:
      - Compaction deletes the only recoverable copy of source messages.
      - A summary is presented as lossless without a path back to its source lineage.
    retrieval:
      fastest: lcm-recall
      fallback: plugin-store
    confidence: declared

  compiled-plan-to-signed-mesh-intent:
    from: representation:compiled-plan
    to: representation:signed-mesh-intent
    relation: transported_as
    via: mechanism:mesh-signed-intent-transport
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.mesh-signed-intent-transport
      - kvnloo/hermes-mesh-keel:README.md
    invariants:
      - Destination Keel revalidates authority before bounded execution.
      - Transport receipts do not silently mutate canonical Kanban lifecycle state.
    invalidators:
      - Transported data executes without destination authority revalidation.
      - Receipt projection completes or reviews a task without the canonical lifecycle owner.
    retrieval:
      fastest: signed-receipt
      fallback: durable-mesh-ledger
    confidence: declared

  tokenomics-to-frozen-evaluation:
    from: representation:tokenomics-event
    to: representation:evaluation-artifact
    relation: frozen_as
    via: mechanism:frozen-eval-publication
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.frozen-eval-publication
      - kvnloo/z0evals:README.md#rules
    invariants:
      - Published claims resolve to pinned study artifacts.
      - Source-reported benchmarks and reproduced measurements remain distinct.
      - A label-generating system does not silently become its own verifier.
    invalidators:
      - A public claim cannot resolve to frozen evidence.
      - Private traces or secrets are included in the public evaluation artifact.
    retrieval:
      fastest: frozen-study-artifact
      fallback: pinned-source-revision
    confidence: declared

  architecture-compression-is-audited:
    from: representation:architecture-snapshot
    to: representation:semantic-compression-receipt
    relation: audited_by
    via: mechanism:z0archy-semantic-compression
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.z0archy-semantic-compression
      - kvnloo/z0archy:README.md#semantic-compression-receipts
    invariants:
      - Hidden high-relevance concepts make a compressed view insufficient rather than silently complete.
      - Visible concepts retain provenance back to the reconstructable source world.
      - Structural entropy is not mislabeled as semantic information content.
    invalidators:
      - A compressed map claims sufficiency while omitting concepts above its relevance threshold.
      - The compressed view cannot reconstruct visible claims back to source provenance.
    retrieval:
      fastest: compression-receipt
      fallback: full-architecture-snapshot
    confidence: declared

  architecture-history-to-hierarchy-proposal:
    from: representation:architecture-snapshot
    to: representation:hierarchy-proposal
    relation: analyzed_as
    via: mechanism:z0archy-hierarchy-meta-learning
    required_evidence:
      - registry/mechanisms.yaml#mechanisms.z0archy-hierarchy-meta-learning
      - kvnloo/z0archy:README.md#slow-hierarchy-meta-learning
    invariants:
      - Hierarchy changes remain proposals until a human changes canonical z0.
      - Declared nodes are never automatic prune candidates.
      - Weak evidence resolves to no-update rather than forcing taxonomy change.
    invalidators:
      - A meta-learning proposal directly mutates canonical architecture.
      - A declared concept is automatically pruned from weak historical evidence.
    retrieval:
      fastest: hierarchy-proposal
      fallback: architecture-history
    confidence: declared
