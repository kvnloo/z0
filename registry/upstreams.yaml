# Zer0 registry — UPSTREAM systems.
#
# A repository we contribute to is NOT automatically supported infrastructure.
# An entry belongs here only when there is an actual dependency, adapter,
# compatibility contract, or explicit reference relationship.
#
# These are never installable Zer0 components and never appear in profiles.
# `upstream_head` is deliberately ABSENT: it is a live fact, discovered by
# `z0 registry doctor`, and committing it would present a cached snapshot as
# fresher than its source.

schema: z0.registry.upstream.v1

upstreams:
  oh-my-pi:
    name: OMP (Oh My Pi)
    repo: kvnloo/oh-my-pi
    upstream_repo: <fork>
    kind: harness
    plane: execution
    is_fork: true
    relationship: executes_via
    summary: >
      Coding-agent runtime. Zer0 executes through it, and the RLM context
      extension lineage lives on its branches. It is one harness among peers,
      never a mandatory architectural root.
    owns: [coding agent runtime]
    not_here: [Zer0 routing policy, Zer0 measurement semantics, harness catalog]
    consumes_contracts: [hotl-0.2, tokenomics.event.v0]
    emits_contracts: [omp.session.aggregate, cu.stage_intent.v0]
    note: >
      The earlier registry pinned this fork to d707478 on
      rfc/interactive-performance-stack, which is the head of OPEN PR #77 —
      an unmerged fork branch presented as architecture truth.

  deepseek-harness:
    name: DeepSeek Harness
    repo: kvnloo/deepseek-harness
    upstream_repo: deepseek-ai/deepseek-harness
    kind: harness
    plane: execution
    is_fork: true
    relationship: executes_via
    summary: >
      Plugin-oriented execution harness: models, tools, sessions, sandboxes and
      UI are all plugins. Zer0 integrates through its adapter/plugin seams
      rather than making a Zer0-specific fork its architectural centre.
    owns: [DSH execution, provider adapters, llm-pi-ai provider/model catalog authority]
    not_here: [Zer0 routing, quota allocation, measurement semantics]
    consumes_contracts: [hotl-0.2, tokenomics.event.v0]
    note: >
      Absent from the previous registry entirely, despite being a primary
      execution surface. Its llm-pi-ai catalog is the authority for provider and
      model identity — z0 must consume it, not mirror it.

  hermes-agent:
    name: Hermes Agent
    repo: NousResearch/hermes-agent
    upstream_repo: NousResearch/hermes-agent
    kind: harness
    plane: execution
    is_fork: false
    relationship: executes_via
    summary: >
      Upstream harness. Several Zer0 systems ship as Hermes plugins (Kerdoios
      today; hermes-jev-skills, hermes-keel), which is an implementation
      detail of those components, not of the harness abstraction.
    owns: [Hermes agent runtime]
    not_here: [Zer0 routing policy, harness catalog]
    consumes_contracts: [hotl-0.2, tokenomics.event.v0]

  sol-pi:
    name: SoL-Pi
    repo: kvnloo/SoL-Pi
    upstream_repo: NVlabs/SoL-Pi
    kind: research
    plane: context
    is_fork: true
    relationship: reference_to
    summary: >
      Upstream research origin of the SoL-Pi mechanism family. There is NO
      canonical `sol-pi` component in the network: the mechanisms are Action
      Fusion, observation packing/reduction, verified reduction and context
      economics, implemented in sol-pi-omp and sol-pi-hermes.
    owns: [upstream research prototype]
    not_here: [a shipped Zer0 component]

  o8:
    name: o8
    repo: kvnloo/o8
    upstream_repo: <fork>
    kind: control_room
    plane: execution
    is_fork: true
    relationship: reference_to
    summary: Multi-harness control room and AODL catalog member.
    owns: [upstream control room]
    not_here: [Zer0-owned surface]

  firstmate:
    name: Firstmate
    repo: kvnloo/firstmate
    upstream_repo: <fork>
    kind: distro
    plane: execution
    is_fork: true
    relationship: reference_to
    summary: An agent distro. Explicitly NOT itself a harness — classifying it as one is the category error this file exists to prevent.
    owns: [agent distribution]
    not_here: [harness role]

  agenttrace:
    name: AgentTrace
    repo: kvnloo/agenttrace
    upstream_repo: <fork>
    kind: observability
    plane: measurement
    is_fork: true
    relationship: reference_to
    summary: >
      Local-first TUI/CLI over agent-session history. An observational consumer,
      NOT the neutral metric authority — Tokenomics owns measurement semantics.
    owns: [agent session history inspection]
    not_here: [measurement semantics]
    consumes_contracts: [tokenomics.event.v0]

  NanoJev:
    name: NanoJev
    repo: kvnloo/NanoJev
    upstream_repo: <fork>
    kind: model
    plane: cognition
    is_fork: true
    relationship: reference_to
    summary: >
      JEV-family implementation. A candidate behind z0intelligence's
      DecisionBackend contract, not an owner of decision policy.
    owns: [JEV-family implementation]
    not_here: [decision ownership]

  laya:
    name: Laya
    repo: kvnloo/laya
    upstream_repo: <fork>
    kind: model
    plane: cognition
    is_fork: true
    relationship: reference_to
    summary: Typed-decision model family; a DecisionBackend candidate behind z0intelligence.
    owns: [typed-decision model]
    not_here: [decision ownership]

  laya-coreml:
    name: Laya (Core ML)
    repo: kvnloo/laya-coreml
    upstream_repo: <fork>
    kind: model
    plane: cognition
    is_fork: true
    relationship: reference_to
    summary: Apple Core ML / Neural Engine runtime for Laya typed decisions.
    owns: [Core ML runtime for Laya]
    not_here: [decision ownership]

  laya-mlx:
    name: Laya (MLX)
    repo: kvnloo/laya-mlx
    upstream_repo: <fork>
    kind: model
    plane: cognition
    is_fork: true
    relationship: reference_to
    summary: Native MLX runtime for Laya typed decision models.
    owns: [MLX runtime for Laya]
    not_here: [decision ownership]

  jev-ultrafast:
    name: Jev Ultrafast
    repo: kvnloo/jev-ultrafast
    upstream_repo: <fork>
    kind: model
    plane: cognition
    is_fork: true
    relationship: reference_to
    summary: JEV-family latency experiment.
    owns: [JEV latency experiment]
    not_here: [decision ownership]

  memento:
    name: Memento
    repo: kvnloo/memento
    upstream_repo: <fork>
    kind: legacy
    plane: memory
    is_fork: true
    relationship: reference_to
    summary: >
      Fork of the Memento screen recorder; upstream last active 2024. A possible
      FUTURE prospective sensor for screen/computer-use history — emphatically
      not the current runtime memory authority. Zer0 has no memory authority
      today.
    owns: []
    not_here: [runtime memory authority, research KB]
    note: >
      The previous registry listed this as `kind: memory`, `status: idea`, and a
      peer component. It is a 2024 screenshot recorder.

# ---------------------------------------------------------------------------
# REFERENCE-ONLY and DONOR entries.
#
# Owned repositories that are NOT part of the Zer0 network: product lines and
# superseded aliases. They are listed so the almanac accounts for every repo we
# swept, without pretending they are supported infrastructure.
# ---------------------------------------------------------------------------

reference_only:
  blueprint:
    name: Blueprint
    repo: kvnloo/blueprint
    class: reference_only
    kind: product_line
    relationship: reference_to
    summary: >
      ATLAS / vertical-farming digital-twin product line. Its GitHub description
      ("Product blueprint monorepo: architecture, brand, specs") is stale and
      misleading; the open PRs are the soil-to-cell prototype.
    not_here: [Zer0 architecture, runtime]
    note: >
      Referent verified during the current-state sweep. A product line, not
      network architecture — it must not enter the almanac as a component.

  solarpunk:
    name: solarpunk
    repo: kvnloo/solarpunk
    class: reference_only
    kind: product_line
    relationship: reference_to
    summary: >
      Actively developed GrowTwin / agritech product repo. Legacy *relative to
      Zer0 architecture*, which is not the same claim as abandoned.
    not_here: [Zer0 runtime]
    note: >
      442 open PRs and commits through 2026-09. Do not describe it as a dead
      donor repo; do not describe it as Zer0 infrastructure either.

  openjev:
    name: OpenJev (alias)
    repo: kvnloo/openjev
    class: reference_only
    kind: superseded_alias
    relationship: legacy_of
    superseded_by: z0intelligence
    summary: >
      `kvnloo/openjev` resolves to `kvnloo/z0intelligence`. The old registry
      listed it as an independent decision component owning local SLM decision
      heads; that was a duplicate ownership claim over one repository.
    not_here: [independent decision ownership]
    note: >
      Ownership converged into z0intelligence's DecisionBackend / cognition
      surface. Retained only as alias provenance so older references resolve.

  hermes-k8s-lab:
    name: hermes-k8s-lab
    class: reference_only
    kind: k8s_substrate
    relationship: reference_to
    local_path: ~/zer0/oss/hermes-k8s-lab
    summary: >
      Kubernetes substrate work: cluster templates, CPU service workloads and GPU
      pools kept scaled to zero. Deliverable 7 (Kubernetes as an OPTIONAL runtime
      substrate) depends on it, and its offers already reach Kerdoios through the
      kubernetes provider.
    not_here: [resource placement, provider/model inventory, capability trust]
    note: >
      Declared by `local_path` and NOT by `repo` because it has no remote at all
      (`git remote -v` is empty), so it has no canonical identity to register
      against. `components.yaml` requires a `repo`, and inventing one would
      register a repository that does not exist. This entry exists so the almanac
      accounts for the tree; promoting it to a component is blocked on a remote,
      not on a decision.

  k8s-maintainer:
    name: k8s-maintainer
    class: reference_only
    kind: upstream_triage
    relationship: reference_to
    local_path: ~/zer0/oss/k8s-maintainer
    summary: Upstream Kubernetes-project issue triage.
    not_here: [Zer0 cluster operation, resource placement, k8s substrate]
    note: >
      Name collision, not a substrate. The name reads as cluster infrastructure;
      it triages upstream Kubernetes issues. Recorded so the collision stops being
      rediscovered, and so it is not mistaken for hermes-k8s-lab.

  # -------------------------------------------------------------------------
  # The "company OS" generation: a SECOND architecture with its own
  # machine-readable inventory, discovered by the local-checkout census after
  # 41 unversioned trees stopped being discarded.
  #
  # `products/pm/architecture/nanoservices.json` declares schema 1, protocol
  # `zer0.local` major 1, and five independently releasable services
  # (zer0-pm, zer0-cockpit, zer0-voice, zer0-canvas, zer0-harness-spine) split
  # out of one integration monorepo. It shares ZERO entity ids with this
  # registry, and nothing in the registered stack references it: grepping z0's
  # registry and lib, kerdoios, z0intelligence, z0evals and evolution-lab for
  # `zer0.local`, `nanoservice`, `harness-spine` or `zer0-cockpit` returns
  # nothing.
  #
  # These are recorded as `reference_only` because they are NOT part of the
  # current Zer0 network -- not because they are unimportant. The overlap is
  # real and is set out in the sprint's redundancy report:
  #
  #   zer0-harness-spine  "event schemas, handshake, Codex/provider/ingress
  #                       adapters"   vs z0 contracts, DSH provider catalog
  #                       authority, AODL intent, z0intelligence backends
  #   zer0-pm             "issue graph, event ledger, leases, scheduling"
  #                                   vs Kerdoios placement/quota, Tokenomics
  #                       ledger, hermes-agent-cluster leases
  #   zer0-cockpit        "tmux/TUI projections and user commands"
  #                                   vs dash, z0archy
  #   zer0-voice          ASR/VAD/turn ownership   vs NOTHING in this registry
  #
  # Whether this generation is superseded by the current stack or a parallel
  # line is NOT asserted here: the split stalled on 2026-07-26, one service
  # (zer0-canvas) was never published, and no consumer exists either way. It is
  # recorded so it stops being rediscovered, with the relationship left open.
  # -------------------------------------------------------------------------

  zer0-harness-spine:
    name: zer0-harness-spine (company-OS generation)
    repo: kvnloo/zer0-harness-spine
    class: reference_only
    kind: parallel_architecture
    relationship: reference_to
    summary: >
      Ultra-thin contracts and harness/provider adapters for the "company OS"
      generation: `contracts/{event,service-handshake,committed-voice-turn}`,
      `adapters/{codex,llm,voice_pm,voice_canvas,google_meet,tldraw}`. Its three
      schemas use `https://zer0.local/contracts/...` ids, not the
      `<owner>.<thing>.v<major>` convention, and none is registered as an
      interface here because nothing outside this generation consumes them.
    not_here: [current Zer0 contracts, provider selection, orchestration policy]
    note: >
      The contract/provider overlap is the reason this entry exists. `providers`
      and `events` are declared module owners here, while this registry assigns
      provider identity to DSH's `llm-pi-ai` catalog, selection to
      z0intelligence, and measurement events to Tokenomics.

  zer0-pm-company-os:
    name: zer0-pm (company-OS generation)
    repo: kvnloo/zer0-pm
    class: reference_only
    kind: parallel_architecture
    relationship: reference_to
    summary: >
      "Deterministic issue graph, ledger, fleet scheduler and benchmarks" for the
      company-OS generation. The composition root is `kvnloo/pm`, which holds
      `architecture/nanoservices.json`.
    not_here: [Kerdoios placement and quota, Tokenomics measurement ledger]
    note: >
      Declared here rather than as `pm` to avoid colliding with the integration
      monorepo of the same short name. GitHub resolves `kvnloo/zer0-pm` to a
      repository whose display name is `_pm`.

  zer0-cockpit:
    name: zer0-cockpit (company-OS generation)
    repo: kvnloo/zer0-cockpit
    class: reference_only
    kind: parallel_architecture
    relationship: reference_to
    summary: >
      "tmux/TUI projections and interaction only; never owns business state."
    not_here: [authoritative issue state, agent scheduling, current dashboards]
    note: >
      The declared shape -- a projection that owns no state -- is the same
      discipline `dash` and `z0archy` follow against this registry.

  zer0-voice:
    name: zer0-voice (company-OS generation)
    repo: kvnloo/zer0-voice
    class: reference_only
    kind: parallel_architecture
    relationship: reference_to
    summary: >
      "Continuous ASR, turn ownership, harness conversation and TTS", with
      `control_plane.py`, `budget.py`, `canary.py` and a candidate-service.
    not_here: [issue state, cockpit rendering, harness protocol implementations]
    note: >
      The only capability in either architecture with NO registered counterpart:
      this registry has no speech or audio surface at all. Also the largest local
      working tree of the generation (23 dirty files), and its `known_migration_edge`
      -- `voice/duplex.py` and `voice/workspace_router.py` still assemble
      `sys.path` instead of importing an installable spine package -- is the
      migration the split never finished.

  pm-integration-mono:
    name: voice-canvas-pm-monorepo (integration workspace)
    repo: kvnloo/pm
    class: reference_only
    kind: parallel_architecture
    relationship: reference_to
    summary: >
      The composition root the four services were extracted from. Holds
      `architecture/` (the second machine-readable architecture inventory),
      `ops/extract.py` (the extraction tool) and `publish/` (one PUBLISHING.md
      per extracted repo). PRIVATE on GitHub.
    not_here: [current Zer0 architecture, runtime]
    note: >
      Listed so the second architecture inventory is findable from this registry.
      `PUBLISHING.md` orders extraction to "delete extracted paths from the
      integration repository only after every review branch reproduces the
      end-to-end canary" -- that step never ran, which is why the monorepo and
      all four extractions still exist side by side.
