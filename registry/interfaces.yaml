# Cross-system contracts.
#
# Two classes, kept apart on purpose:
#
#   contract  — a GENERIC ecosystem contract. Its owner is a semantic
#               responsibility, not a repository, and any harness may implement
#               or consume it.
#   adapter   — an IMPLEMENTATION-specific wire surface. It names the harness it
#               belongs to and must never be presented as a shared contract.
#
# Schemas live in the owning repo. z0 records the name, the owner and the class.

interfaces:
  # ---- generic ecosystem contracts ---------------------------------------
  aodl.intent.v1:
    class: contract
    owner: aodl
    summary: Typed intent / plan contract. Governs execution; is not runtime execution.

  aodl.observed_state.v1:
    class: contract
    owner: aodl
    summary: Observed execution state distinct from the compiled plan.

  tokenomics.event.v0:
    class: contract
    owner: tokenomics
    summary: Vendor-neutral usage / cost / latency / outcome event envelope.

  tokenomics.report.v1:
    class: contract
    owner: tokenomics
    summary: Aggregated reconciliation, coverage and verified-task report.

  z0int.decision_receipt.v1:
    class: contract
    owner: z0intelligence
    summary: Replayable routing/policy decision receipt (state, candidates, quota, outcome).

  z0int.cognition.receipt.v1:
    class: contract
    owner: z0intelligence
    summary: Cognition decision receipt including the eligible candidate set and surface verdict.

  kerdoios.placement.v1:
    class: contract
    owner: kerdoios
    summary: Placement decision over a resource portfolio. Allocation, not execution.

  kerdoios.quota_state.v1:
    class: contract
    owner: kerdoios
    summary: Dimensional quota state (rpm/rpd/tpm/tpd) with per-dimension provenance.

  flow.prediction.v1:
    class: contract
    owner: flow
    summary: OS-context prediction with horizon metadata and gates.

  rlm.evidence_handle.v0:
    class: contract
    owner: rlm
    summary: Addressable handle into the evidence plane, rehydratable on demand.

  z0evals.study.v1:
    class: contract
    owner: z0evals
    summary: Frozen reproducible study record. Immutable once published.

  harness.execution.v0:
    class: contract
    owner: aodl
    summary: >
      The harness-neutral execution seam. Every harness adapter implements this
      and nothing above it may special-case a harness.

  # ---- implementation-specific adapters ----------------------------------
  omp.session.aggregate:
    class: adapter
    harness: oh-my-pi
    owner: oh-my-pi
    summary: OMP-specific session-level token rollup for Tokenomics reconciliation.

  omp.rlm.spill.v0:
    class: adapter
    harness: oh-my-pi
    owner: oh-my-pi
    summary: OMP-specific RLM context-spill surface. Not a shared contract.

  cu.stage_intent.v0:
    class: adapter
    harness: oh-my-pi
    owner: oh-my-pi
    summary: OMP-specific Handsfree / computer-use window and layout intent.

  dsh.llm_pi_ai.catalog:
    class: adapter
    harness: deepseek-harness
    owner: deepseek-harness
    summary: >
      DSH llm-pi-ai provider/model catalog. The AUTHORITY for provider and model
      identity — z0 consumes this rather than mirroring it.

  hermes.plugin.v0:
    class: adapter
    harness: hermes-agent
    owner: hermes-agent
    summary: Hermes plugin surface. Several Zer0 components ship through it.

  agenttrace.span.v0:
    class: adapter
    harness: agenttrace
    owner: agenttrace
    summary: Historical agent span for observability export. Observational only.

  # --- added 2026-09-22 ------------------------------------------------------

  kerdoios.resource_offer.v1:
    class: contract
    owner: kerdoios
    summary: >
      One normalized shape for every execution offer regardless of substrate:
      host CPU/GPU, Kubernetes, or a remote provider (Groq, Cerebras,
      OpenRouter, Nous, Vercel, xAI). Kerdoios owns the type and selects among
      offers. Producers emit it; consumers must NOT special-case a provider
      outside the adapter/placement boundary.

      Status is uneven and the registry should say so. Produced today: the host
      runtime and the remote provider adapters. NOT yet produced: Kubernetes.
      The only k8s lab (hermes-k8s-lab) is unpublished -- it has no git remote
      and no GitHub repository -- so the k8s producer is a declared gap, not an
      implemented one. Fields with no producer anywhere: route, economic_class,
      throughput, residency, startup_cost, location, node, backend, warm,
      resident, startup_ms, health_endpoint, queue_depth, namespace, pod,
      service. `resident` must be a live-runtime observation and never config
      intent.

  z0int.decision_result.v1:
    class: contract
    owner: z0intelligence
    summary: >
      Frozen DecisionRequest/DecisionResult pair for a DecisionBackend. This is
      the host-vs-k8s parity contract: the same request must produce the same
      result whether served by an in-process host backend or by a service, with
      only transport and placement differing. What may differ: transport
      latency, queue time, process identity. What may NOT differ: the chosen
      action, probabilities, model identity and revision. No service
      implementation exists yet, so parity is declared and unproven; any
      comparison must use the existing comparability gate rather than a bespoke
      comparator.

  # --- restored 2026-09-22 from the pre-federation generation ----------------
  # These two were declared on origin/main and dropped when the two registry
  # generations were converged, because the local branch's interfaces.yaml had
  # been written without them. They are declared contracts with a named owner;
  # whether an owner STAMPS them is a separate question (see the audit note on
  # kerdoios not stamping placement.v1/quota_state.v1).
  #
  # origin/main's `flow_prediction.v1` was NOT restored as a separate entry: it
  # is `flow.prediction.v1` under the older spelling, with identical owner and
  # summary. The rename is recorded here rather than as a duplicate contract.
  flow_prediction.v1:
    class: superseded_alias
    owner: flow
    summary: >
      Superseded spelling of `flow.prediction.v1`. Identical owner and summary;
      the id was normalised to the owner-prefixed `<owner>.<thing>.v<major>`
      convention. Retained so older references resolve.

  kerdoios.route.v1:
    class: contract
    owner: kerdoios
    summary: Model/provider routing decision with cost estimate.

  os.next_context.v0:
    class: contract
    owner: flow
    summary: >
      Shadow prediction of next desktop context episode. Restored with the owner
      origin/main declared; the audit record notes z0intelligence also carries
      os-context machinery, so ownership here is worth confirming rather than
      assuming.
