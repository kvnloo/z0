# Zer0 component registry — canonical cross-system facts.
# Implementation docs live in each repo; this file is the map.

components:
  oh-my-pi:
    name: OMP (Oh My Pi)
    repo: kvnloo/oh-my-pi
    kind: runtime
    status: canary
    execution: canary
    owner: Runtime
    summary: >
      Coding agent runtime: CLI, RPC, RLM context spill, Jev decisions,
      Handsfree HUD, Live voice, and computer-use stage manager.
    required: true
    profiles: [minimal, core, personal, desktop, compute, full]
    depends_on: []
    integrates_with: [tokenomics, z0intelligence, aodl, kerdoios, agenttrace]
    provides:
      - omp.session.aggregate
      - cu.stage_intent.v0
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
      - aodl.intent.v1
      - kerdoios.route.v1
    install:
      clone: https://github.com/kvnloo/oh-my-pi.git
      branch: rfc/interactive-performance-stack
      ref: d707478d4c5c72784c058a0163b616988f559230
      command: bun install && bun run build
    verify:
      command: bun test packages/coding-agent/test/rlm-tokenomics-bridge.test.ts
    docs:
      readme: README.md
      architecture: docs/rfc-interactive-performance-stack.md
    boundaries:
      owns: [coding agent runtime, voice/stage/CU, RLM spill, Jev hotpath]
      not_here: [token measurement, routing policy store, research KB]
    onboard:
      gate: generic
      requires: {tools: ["bun>=1.4.3", "git"], optional: ["rustup"]}
      hardware: {os: [linux, darwin], arch: [x86_64, arm64], min_ram_gib: 2, min_disk_gib: 5, gpu: none}
      public_ready: [revs_on_origin, no_private_on_auto_path]
      steps:
        - {id: oh-my-pi.source, kind: adopt_or_clone, consent: {class: C0}, network: true, where: mirror,
           probe: {exists: "$Z0_HOME/repos/{name}"}}
        - {id: oh-my-pi.install, kind: run, consent: {class: C0}, network: true, where: build,
           needs: [oh-my-pi.source], argv: [bun, install], creates: ["{tree}/node_modules"],
           legacy_projection: true, timeout_s: 1800}
        - {id: oh-my-pi.build, kind: run, consent: {class: C0}, where: build, needs: [oh-my-pi.install],
           argv: [bun, run, build], probe: {exists: "{tree}/packages/coding-agent/dist"},
           legacy_projection: true, timeout_s: 1800}
        # S1: `./omp setup` links the OMP harness to the tree it runs from, so it runs
        # only from a stamped release (with its own deps and build), never a checkout.
        - {id: oh-my-pi.build_tree, kind: build_tree, consent: {class: C0}, network: true, where: build,
           when: [{fact: harnesses.omp.state, op: eq, value: installed}],
           creates: ["$Z0_HOME/build/{id}/{pin}"], undo: {kind: remove_owned}}
        - {id: oh-my-pi.release, kind: stage_release, consent: {class: C0}, where: release,
           needs: [oh-my-pi.build_tree], when: [{fact: harnesses.omp.state, op: eq, value: installed}],
           creates: ["~/.local/lib/oh-my-pi/releases/{pin}"], undo: {kind: remove_owned}}
        - {id: oh-my-pi.release.deps, kind: run, consent: {class: C0}, network: true, where: release,
           needs: [oh-my-pi.release], when: [{fact: harnesses.omp.state, op: eq, value: installed}],
           argv: [bun, install], creates: ["~/.local/lib/oh-my-pi/releases/{pin}/node_modules"], timeout_s: 1800}
        - {id: oh-my-pi.release.build, kind: run, consent: {class: C0}, where: release,
           needs: [oh-my-pi.release.deps], when: [{fact: harnesses.omp.state, op: eq, value: installed}],
           argv: [bun, run, build], probe: {exists: "~/.local/lib/oh-my-pi/releases/{pin}/packages/coding-agent/dist"},
           timeout_s: 1800}
        - {id: oh-my-pi.setup, kind: harness_plugin, harness: omp, consent: {class: C1, bundle: harness},
           where: release, needs: [oh-my-pi.release.build], argv: [./omp, setup],
           when: [{fact: harnesses.omp.state, op: eq, value: installed}],
           probe: {exists: "$Z0_HOME/onboard/stamps/oh-my-pi.setup"}, undo: {kind: restore_backup}}
        - {id: oh-my-pi.verify, kind: check, consent: {class: C0}, where: build,
           needs: [oh-my-pi.build, tokenomics.install.python, z0intelligence.checks.import],
           argv: [bun, test, packages/coding-agent/test/rlm-tokenomics-bridge.test.ts], legacy_projection: true}
      acceptance: {tiers: [{name: verify, checks: [oh-my-pi.verify]}]}
      remediations: [mark_unavailable]

  tokenomics:
    name: Tokenomics
    repo: kvnloo/tokenomics
    kind: measurement
    status: experimental
    execution: live
    owner: Measurement
    summary: >
      Vendor-neutral measurement kernel for token, cost, latency,
      and verified-task economics with reconciliation reports.
    required: false
    profiles: [core, personal, desktop, compute, research, full]
    depends_on: []
    integrates_with: [oh-my-pi, z0intelligence, kerdoios, agenttrace, flow]
    provides:
      - tokenomics.event.v0
      - tokenomics.report.v1
    consumes:
      - z0int.decision_receipt.v1
      - flow_prediction.v1
    install:
      clone: https://github.com/kvnloo/tokenomics.git
      branch: master
      ref: 65e8f2dd9d6c5784a2a1c67f5236d69a5ae94021
      command: pip install -e packages/python && npm install -w packages/typescript
    verify:
      command: tokenomics report --range today
    docs:
      architecture: packages/python/src/tokenomics/report.py
      integration: docs/MIGRATION.md
    boundaries:
      owns: [usage attribution, savings reports, reconciliation]
      not_here: [routing policy, provider execution, agent runtime]
    onboard:
      gate: generic
      requires: {tools: ["git", "python>=3.10", "node>=20", "npm"]}
      hardware: {os: [linux, darwin], arch: [x86_64, arm64], min_ram_gib: 2, min_disk_gib: 1, gpu: none}
      python: {window: ">=3.10", prefer: "3.12", venv: own}
      public_ready: [revs_on_origin]
      steps:
        - {id: tokenomics.source, kind: adopt_or_clone, consent: {class: C0}, network: true, where: mirror,
           probe: {exists: "$Z0_HOME/repos/{name}"}}
        - {id: tokenomics.venv, kind: venv, consent: {class: C0}, where: venv, needs: [tokenomics.source],
           creates: ["$Z0_HOME/venvs/{id}"], probe: {exists: "$Z0_HOME/venvs/{id}/bin/python"},
           undo: {kind: remove_owned}}
        - {id: tokenomics.install.python, kind: pip_install, consent: {class: C0}, network: true, where: venv,
           needs: [tokenomics.venv], argv: [pip, install, -e, .],
           probe: {exists: "$Z0_HOME/venvs/{id}/bin/tokenomics"}, legacy_projection: true}
        - {id: tokenomics.install.npm, kind: run, consent: {class: C0}, network: true, where: build,
           needs: [tokenomics.source], argv: [npm, install, -w, packages/typescript],
           creates: ["{tree}/node_modules"], legacy_projection: true, timeout_s: 1800}
        - {id: tokenomics.verify, kind: check, consent: {class: C0}, where: venv,
           needs: [tokenomics.install.python], argv: [tokenomics, report, --range, today], legacy_projection: true}
      acceptance: {tiers: [{name: verify, checks: [tokenomics.verify]}]}
      remediations: [mark_unavailable]

  flow:
    name: Flow
    repo: kvnloo/.files
    kind: desktop
    status: experimental
    execution: shadow
    owner: Desktop
    summary: >
      Predictive desktop UX: context episodes, prediction horizons,
      prepare cache, and routine suggestion miner (workspace copilot).
    required: false
    profiles: [desktop, full]
    depends_on: [oh-my-pi]
    integrates_with: [tokenomics, z0intelligence]
    provides:
      - flow_prediction.v1
      - os.next_context.v0
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/.files.git
      branch: feat/workspace-copilot-flow
      ref: 5259013185d97422022fc225fa70245595b046ea
      command: echo 'Flow scripts live in scripts/workspace_flow.py — see component README'
    verify:
      command: python3 scripts/workspace_flow.py --help
    docs:
      readme: scripts/workspace_flow.py
    boundaries:
      owns: [OS prediction, prepare, routine mining]
      not_here: [agent runtime, token accounting, training loops]
    onboard:
      gate: generic
      requires: {tools: ["git", "python>=3.10"]}
      hardware: {os: [linux], arch: [x86_64, arm64], min_ram_gib: 2, min_disk_gib: 1, gpu: none}
      public_ready: [revs_on_origin]
      steps:
        - {id: flow.source, kind: adopt_or_clone, consent: {class: C0}, network: true, where: mirror,
           when: [{fact: os.os, op: eq, value: linux}, {fact: session.desktop, op: ne, value: none}],
           probe: {exists: "$Z0_HOME/repos/{name}"}}
        - {id: flow.link, kind: ask, consent: {class: C0}, needs: [flow.source],
           argv: [echo, "dotfiles link or apply is never automatic (C2); see the repo README"]}
        - {id: flow.verify, kind: check, consent: {class: C0}, where: build, needs: [flow.source],
           argv: [python3, scripts/workspace_flow.py, --help], legacy_projection: true}
      acceptance: {tiers: [{name: verify, checks: [flow.verify]}]}

  z0intelligence:
    name: z0intelligence
    repo: kvnloo/z0intelligence
    kind: intelligence
    status: experimental
    execution: log_only
    owner: Personal Intelligence
    summary: >
      Personal intelligence layer: provenance-backed context resolution,
      bounded decision backends, specialist/routine runtime, and auditable receipts.
    required: false
    profiles: [personal, research, full]
    depends_on: [tokenomics]
    integrates_with: [oh-my-pi, kerdoios, evolution-lab, tokenomics, aodl]
    provides:
      - z0int.decision_receipt.v1
      - z0int.context_resolve.v1
    consumes:
      - tokenomics.report.v1
      - flow_prediction.v1
      - aodl.intent.v1
    install:
      clone: https://github.com/kvnloo/z0intelligence.git
      branch: master
      ref: cfb33e5fabafe198c622f9178af18b4bc56749e7
      command: pip install -e .
    verify:
      command: python3 -m z0int --help
    boundaries:
      owns: [personal policy, provenance-backed context resolution, bounded decision backends, routine promotion, specialist runtime]
      not_here: [source memory databases, harness execution, experiment promotion, OS prediction, measurement kernel]
    onboard:
      gate: z0int
      requires: {tools: ["git", "python-window"], optional: ["llama-server", "agentsview"]}
      hardware: {os: [linux, darwin], arch: [x86_64, arm64], min_ram_gib: 8, min_disk_gib: 10, gpu: any}
      python: {window: ">=3.10,<3.14", prefer: "3.11", venv: own}
      public_ready: [revs_on_origin, no_private_on_auto_path]
      secrets:
        - {name: CEREBRAS_API_KEY, kind: env, required: false}
        - {name: GROQ_API_KEY, kind: env, required: false}
        - {name: OPENROUTER_API_KEY, kind: env, required: false}
        - {name: NVIDIA_API_KEY, kind: env, required: false}
        - {name: DEEPSEEK_API_KEY, kind: env, required: false}
        - {name: AI_GATEWAY_API_KEY, kind: env, required: false}
      steps:
        - {id: z0intelligence.source, kind: adopt_or_clone, consent: {class: C0}, network: true, where: mirror,
           probe: {exists: "$Z0_HOME/repos/{name}"}}
        - {id: z0intelligence.dev, kind: pip_install, consent: {class: C0}, network: true, where: build,
           needs: [z0intelligence.source], when: [{fact: mode, op: eq, value: guided}],
           argv: [pip, install, -e, .], probe: {exists: "{tree}/.venv/bin/z0int"}, legacy_projection: true}
        - {id: z0intelligence.build, kind: build_tree, consent: {class: C0}, network: true, where: build,
           creates: ["$Z0_HOME/build/{id}/{pin}"], undo: {kind: remove_owned}}
        - {id: z0intelligence.release, kind: stage_release, consent: {class: C0}, where: release,
           needs: [z0intelligence.build], creates: ["~/.local/lib/z0int-shadow/{pin}"], undo: {kind: remove_owned}}
        - {id: z0intelligence.runtime, kind: venv, consent: {class: C0}, where: venv,
           needs: [z0intelligence.release, toolchain.python-window],
           creates: ["~/.local/lib/z0int-runtime/{pin}"],
           probe: {exists: "~/.local/lib/z0int-runtime/{pin}/bin/python"}, undo: {kind: remove_owned}}
        - {id: z0intelligence.torch, kind: pip_install, consent: {class: C1, bundle: models}, network: true,
           where: venv, needs: [z0intelligence.runtime],
           argv: [pip, install, "torch=={torch_version}", "{torch_index_args}"],
           probe: {exists: "~/.local/lib/z0int-runtime/{pin}/.z0/torch-{torch_version}"}}
        - {id: z0intelligence.install, kind: pip_install, consent: {class: C0}, network: true, where: venv,
           needs: [z0intelligence.torch], argv: [pip, install, "~/.local/lib/z0int-shadow/{pin}"],
           probe: {exists: "~/.local/lib/z0int-runtime/{pin}/bin/z0int"},
           when: [{fact: network.github, op: eq, value: true}]}
        - {id: z0intelligence.shim, kind: write_file, consent: {class: C1, bundle: services}, where: home,
           target_where: venv, needs: [z0intelligence.install], creates: ["~/.z0int/bin/python"], undo: {kind: remove_owned}}
        - {id: z0intelligence.hermes_json, kind: write_file, consent: {class: C1, bundle: services}, where: home,
           target_where: venv, needs: [z0intelligence.shim], creates: ["~/.z0int/config/hermes.json"], undo: {kind: restore_backup}}
        - {id: z0intelligence.checks.import, kind: check, consent: {class: C0}, where: venv,
           needs: [z0intelligence.shim],
           argv: ["~/.z0int/bin/python", -c, "import z0int, mcp, aodl_contract, fff, typesafe_sdk"]}
        - {id: z0intelligence.checks.doctor, kind: check, consent: {class: C0}, where: venv,
           needs: [z0intelligence.checks.import], argv: ["~/.z0int/bin/python", -m, z0int, doctor, --json]}
        - {id: z0intelligence.verify, kind: check, consent: {class: C0}, where: venv,
           needs: [z0intelligence.install], argv: [python3, -m, z0int, --help], legacy_projection: true}
        - {id: z0intelligence.plugin.claude, kind: harness_plugin, harness: claude-code,
           consent: {class: C1, bundle: harness}, where: release, needs: [z0intelligence.checks.import],
           when: [{fact: harnesses.claude_code.state, op: eq, value: installed}],
           argv: [claude, plugin, install, "z0intelligence@z0intelligence"],
           probe: {exists: "$Z0_HOME/onboard/stamps/z0intelligence.plugin.claude"}, undo: {kind: uninstall}}
        - {id: z0intelligence.plugin.codex, kind: harness_plugin, harness: codex,
           consent: {class: C1, bundle: harness}, where: release, needs: [z0intelligence.checks.import],
           when: [{fact: harnesses.codex.state, op: eq, value: installed}],
           argv: [codex, plugin, add, "codex-z0intelligence@z0intelligence"],
           probe: {exists: "$Z0_HOME/onboard/stamps/z0intelligence.plugin.codex"}, undo: {kind: uninstall}}
        - {id: z0intelligence.plugin.omp, kind: harness_plugin, harness: omp,
           consent: {class: C1, bundle: harness}, where: release, needs: [z0intelligence.checks.import],
           when: [{fact: harnesses.omp.state, op: eq, value: installed}],
           argv: [python3, scripts/omp_bridge_install.py],
           probe: {exists: "$Z0_HOME/onboard/stamps/z0intelligence.plugin.omp"}, undo: {kind: restore_backup}}
        - {id: z0intelligence.plugin.hermes, kind: ask, consent: {class: C0},
           when: [{fact: harnesses.hermes.state, op: eq, value: installed}],
           argv: [echo, "Hermes: choose the profile and edit its config.yaml yourself (always an ask)"]}
        - {id: z0intelligence.service_env, kind: write_file, consent: {class: C1, bundle: services}, where: home,
           target_where: venv, needs: [z0intelligence.shim],
           when: [{fact: session.systemd_user, op: eq, value: true}],
           creates: ["~/.config/z0intelligence/service.env"], undo: {kind: restore_backup}}
        - {id: z0intelligence.router.unit, kind: service_unit, consent: {class: C1, bundle: services},
           where: venv, needs: [z0intelligence.shim, z0intelligence.service_env],
           when: [{fact: session.systemd_user, op: eq, value: true}],
           service: {template: z0intelligence, unit: z0intelligence.service, bind: loopback, port: 11501,
                     health: {http: {bind: loopback, port: 11501, path: /healthz, expect_status: 200}},
                     start_order: 3},
           probe: {exists: "~/.config/systemd/user/z0intelligence.service"}, undo: {kind: restore_backup}}
        - {id: z0intelligence.delegate, kind: ask, consent: {class: C0}, needs: [z0intelligence.shim],
           argv: [echo, "z0int onboard (delegate contract z0int-onboard-v1 pending WP-I1)"]}
      harness_integrations: [claude-code, codex, omp, hermes]
      acceptance:
        tiers:
          - {name: import, checks: [z0intelligence.checks.import, z0intelligence.verify]}
          - {name: doctor, checks: [z0intelligence.checks.doctor]}
      remediations: [retry_with_cpu_index, mark_unavailable]

  kerdoios:
    name: Kerdoios
    repo: kvnloo/kerdoios
    kind: compute
    status: experimental
    execution: live
    owner: Compute
    summary: >
      Compute and provider allocation — routes work to frontier vs local
      models with cost/latency awareness.
    required: false
    profiles: [compute, full]
    depends_on: [tokenomics]
    integrates_with: [oh-my-pi, z0intelligence, aodl, tokenomics]
    provides:
      - kerdoios.route.v1
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/kerdoios.git
      branch: main
      ref: cdb43b05a328a50649d5120bffcdecea09492219
      command: pip install -e .
    boundaries:
      owns: [provider routing, allocation policy]
      not_here: [provider execution, token measurement, agent runtime]
    onboard:
      gate: generic
      requires: {tools: ["git", "python>=3.10"]}
      hardware: {os: [linux, darwin], arch: [x86_64, arm64], min_ram_gib: 2, min_disk_gib: 1, gpu: none}
      python: {window: ">=3.10", prefer: "3.12", venv: own}
      public_ready: [revs_on_origin]
      steps:
        - {id: kerdoios.source, kind: adopt_or_clone, consent: {class: C0}, network: true, where: mirror,
           probe: {exists: "$Z0_HOME/repos/{name}"}}
        - {id: kerdoios.venv, kind: venv, consent: {class: C0}, where: venv, needs: [kerdoios.source],
           creates: ["$Z0_HOME/venvs/{id}"], probe: {exists: "$Z0_HOME/venvs/{id}/bin/python"},
           undo: {kind: remove_owned}}
        - {id: kerdoios.install, kind: pip_install, consent: {class: C0}, network: true, where: venv,
           needs: [kerdoios.venv], argv: [pip, install, -e, .],
           probe: {exists: "$Z0_HOME/venvs/{id}/.z0/installed-{pin}"}, legacy_projection: true}
        - {id: kerdoios.import, kind: check, consent: {class: C0}, where: venv, needs: [kerdoios.install],
           argv: ["$Z0_HOME/venvs/{id}/bin/python", -c, "import sys; sys.exit(0)"]}
      acceptance: {tiers: [{name: install, checks: [kerdoios.import]}]}

  evolution-lab:
    name: Evolution Lab
    repo: kvnloo/evolution-lab
    kind: research
    status: experimental
    execution: shadow
    owner: Research
    summary: >
      Experiment engine for locked corpora/splits, candidate evolution, DAgger,
      Pareto/MAP-Elites comparison, and verified specialist promotion.
    required: false
    profiles: [research, full]
    depends_on: [z0intelligence, tokenomics]
    integrates_with: [frontier-kb, z0intelligence]
    provides: []
    consumes:
      - tokenomics.report.v1
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/evolution-lab.git
      branch: trunk
      ref: 1c9b5235d341f9108d6ea4cc886592be7004ef28
      command: pip install -e .
    boundaries:
      owns: [experiment search, locked corpora and splits, candidate evolution, promotion evidence]
      not_here: [production runtime, source memory truth, personal traces]
    onboard:
      gate: generic
      requires: {tools: ["git", "python>=3.10"]}
      hardware: {os: [linux, darwin], arch: [x86_64, arm64], min_ram_gib: 2, min_disk_gib: 1, gpu: none}
      python: {window: ">=3.10", prefer: "3.12", venv: own}
      public_ready: [revs_on_origin]
      steps:
        - {id: evolution-lab.source, kind: adopt_or_clone, consent: {class: C0}, network: true, where: mirror,
           probe: {exists: "$Z0_HOME/repos/{name}"}}
        - {id: evolution-lab.venv, kind: venv, consent: {class: C0}, where: venv, needs: [evolution-lab.source],
           creates: ["$Z0_HOME/venvs/{id}"], probe: {exists: "$Z0_HOME/venvs/{id}/bin/python"},
           undo: {kind: remove_owned}}
        - {id: evolution-lab.install, kind: pip_install, consent: {class: C0}, network: true, where: venv,
           needs: [evolution-lab.venv], argv: [pip, install, -e, .],
           probe: {exists: "$Z0_HOME/venvs/{id}/.z0/installed-{pin}"}, legacy_projection: true}
        - {id: evolution-lab.import, kind: check, consent: {class: C0}, where: venv, needs: [evolution-lab.install],
           argv: ["$Z0_HOME/venvs/{id}/bin/python", -c, "import sys; sys.exit(0)"]}
      acceptance: {tiers: [{name: install, checks: [evolution-lab.import]}]}

  frontier-kb:
    name: frontier-kb
    repo: kvnloo/frontier-kb
    kind: research
    status: experimental
    execution: shadow
    owner: Research
    summary: >
      Research knowledge base: papers, external systems, hypotheses,
      and kill criteria — not private user traces.
    required: false
    profiles: [research, full]
    depends_on: []
    integrates_with: [evolution-lab]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kvnloo/frontier-kb.git
      branch: main
      ref: 22b4c0f1088abfef6184840cb79a0a6a6aceda44
      command: echo 'Knowledge base — see README for ingest workflow'
    boundaries:
      owns: [research evidence, external references]
      not_here: [private user traces, runtime code]
    onboard:
      gate: generic
      requires: {tools: ["git"]}
      hardware: {os: [linux, darwin], arch: [x86_64, arm64], min_ram_gib: 1, min_disk_gib: 1, gpu: none}
      public_ready: [revs_on_origin]
      steps:
        - {id: frontier-kb.source, kind: adopt_or_clone, consent: {class: C0}, network: true, where: mirror,
           probe: {exists: "$Z0_HOME/repos/{name}"}}
        - {id: frontier-kb.readme, kind: check, consent: {class: C0}, where: build, needs: [frontier-kb.source],
           argv: [test, -f, README.md]}
      acceptance: {tiers: [{name: source, checks: [frontier-kb.readme]}]}

  aodl:
    name: AODL
    repo: kvnloo/aodl
    kind: contract
    status: experimental
    execution: shadow
    owner: Contracts
    summary: >
      Typed intent and plan schema — contracts only, not runtime execution.
    required: false
    profiles: [full]
    depends_on: []
    integrates_with: [oh-my-pi, kerdoios]
    provides:
      - aodl.intent.v1
    consumes: []
    install:
      clone: https://github.com/kvnloo/aodl.git
      branch: main
      ref: 416736c80a727757202bdeedb02579c3c820f7f6
      command: pip install -e .
    boundaries:
      owns: [typed intent/plan contracts]
      not_here: [runtime implementation, provider execution]
    onboard:
      gate: generic
      requires: {tools: ["git", "python>=3.10"]}
