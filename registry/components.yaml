# Zer0 component registry — canonical cross-system facts.
# Implementation docs live in each repo; this file is the map.

components:
  oh-my-pi:
    name: OMP (Oh My Pi)
    repo: kvnloo/oh-my-pi
    kind: runtime
    status: canary
    execution: canary
    owner: Runtime
    summary: >
      Coding agent runtime: CLI, RPC, RLM context spill, Jev decisions,
      Handsfree HUD, Live voice, and computer-use stage manager.
    required: true
    profiles: [minimal, core, personal, desktop, compute, full]
    depends_on: []
    integrates_with: [tokenomics, z0intelligence, aodl, kerdoios, agenttrace]
    provides:
      - omp.session.aggregate
      - cu.stage_intent.v0
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
      - aodl.intent.v1
      - kerdoios.route.v1
    install:
      clone: https://github.com/kvnloo/oh-my-pi.git
      branch: rfc/interactive-performance-stack
      ref: d707478d4c5c72784c058a0163b616988f559230
      command: bun install && bun run build
    verify:
      command: bun test packages/coding-agent/test/rlm-tokenomics-bridge.test.ts
    docs:
      readme: README.md
      architecture: docs/rfc-interactive-performance-stack.md
    boundaries:
      owns: [coding agent runtime, voice/stage/CU, RLM spill, Jev hotpath]
      not_here: [token measurement, routing policy store, research KB]

  tokenomics:
    name: Tokenomics
    repo: kvnloo/tokenomics
    kind: measurement
    status: experimental
    execution: live
    owner: Measurement
    summary: >
      Vendor-neutral measurement kernel for token, cost, latency,
      and verified-task economics with reconciliation reports.
    required: false
    profiles: [core, personal, desktop, compute, research, full]
    depends_on: []
    integrates_with: [oh-my-pi, z0intelligence, kerdoios, agenttrace, flow]
    provides:
      - tokenomics.event.v0
      - tokenomics.report.v1
    consumes:
      - z0int.decision_receipt.v1
      - flow_prediction.v1
    install:
      clone: https://github.com/kvnloo/tokenomics.git
      branch: master
      ref: 65e8f2dd9d6c5784a2a1c67f5236d69a5ae94021
      command: pip install -e packages/python && npm install -w packages/typescript
    verify:
      command: tokenomics report --range today
    docs:
      architecture: packages/python/src/tokenomics/report.py
      integration: docs/MIGRATION.md
    boundaries:
      owns: [usage attribution, savings reports, reconciliation]
      not_here: [routing policy, provider execution, agent runtime]

  flow:
    name: Flow
    repo: kvnloo/.files
    kind: desktop
    status: experimental
    execution: shadow
    owner: Desktop
    summary: >
      Predictive desktop UX: context episodes, prediction horizons,
      prepare cache, and routine suggestion miner (workspace copilot).
    required: false
    profiles: [desktop, full]
    depends_on: [oh-my-pi]
    integrates_with: [tokenomics, z0intelligence]
    provides:
      - flow_prediction.v1
      - os.next_context.v0
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/.files.git
      branch: feat/workspace-copilot-flow
      ref: 5259013185d97422022fc225fa70245595b046ea
      command: echo 'Flow scripts live in scripts/workspace_flow.py — see component README'
    verify:
      command: python3 scripts/workspace_flow.py --help
    docs:
      readme: scripts/workspace_flow.py
    boundaries:
      owns: [OS prediction, prepare, routine mining]
      not_here: [agent runtime, token accounting, training loops]

  z0intelligence:
    name: z0intelligence
    repo: kvnloo/z0intelligence
    kind: intelligence
    status: experimental
    execution: log_only
    owner: Personal Intelligence
    summary: >
      Personal intelligence layer: provenance-backed context resolution,
      bounded decision backends, specialist/routine runtime, and auditable receipts.
    required: false
    profiles: [personal, research, full]
    depends_on: [tokenomics]
    integrates_with: [oh-my-pi, kerdoios, evolution-lab, tokenomics, aodl]
    provides:
      - z0int.decision_receipt.v1
      - z0int.context_resolve.v1
    consumes:
      - tokenomics.report.v1
      - flow_prediction.v1
      - aodl.intent.v1
    install:
      clone: https://github.com/kvnloo/z0intelligence.git
      branch: master
      ref: 0563ed7a52071cca63ccc91b8c9040207ad23e5d
      command: pip install -e .
    verify:
      command: python3 -m z0int --help
    boundaries:
      owns: [personal policy, provenance-backed context resolution, bounded decision backends, routine promotion, specialist runtime]
      not_here: [source memory databases, harness execution, experiment promotion, OS prediction, measurement kernel]

  kerdoios:
    name: Kerdoios
    repo: kvnloo/kerdoios
    kind: compute
    status: experimental
    execution: live
    owner: Compute
    summary: >
      Compute and provider allocation — routes work to frontier vs local
      models with cost/latency awareness.
    required: false
    profiles: [compute, full]
    depends_on: [tokenomics]
    integrates_with: [oh-my-pi, z0intelligence, aodl, tokenomics]
    provides:
      - kerdoios.route.v1
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/kerdoios.git
      branch: main
      ref: cdb43b05a328a50649d5120bffcdecea09492219
      command: pip install -e .
    boundaries:
      owns: [provider routing, allocation policy]
      not_here: [provider execution, token measurement, agent runtime]

  evolution-lab:
    name: Evolution Lab
    repo: kvnloo/evolution-lab
    kind: research
    status: experimental
    execution: shadow
    owner: Research
    summary: >
      Experiment engine for locked corpora/splits, candidate evolution, DAgger,
      Pareto/MAP-Elites comparison, and verified specialist promotion.
    required: false
    profiles: [research, full]
    depends_on: [z0intelligence, tokenomics]
    integrates_with: [frontier-kb, z0intelligence]
    provides: []
    consumes:
      - tokenomics.report.v1
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/evolution-lab.git
      branch: trunk
      ref: 1c9b5235d341f9108d6ea4cc886592be7004ef28
      command: pip install -e .
    boundaries:
      owns: [experiment search, locked corpora and splits, candidate evolution, promotion evidence]
      not_here: [production runtime, source memory truth, personal traces]

  frontier-kb:
    name: frontier-kb
    repo: kvnloo/frontier-kb
    kind: research
    status: experimental
    execution: shadow
    owner: Research
    summary: >
      Research knowledge base: papers, external systems, hypotheses,
      and kill criteria — not private user traces.
    required: false
    profiles: [research, full]
    depends_on: []
    integrates_with: [evolution-lab]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kvnloo/frontier-kb.git
      branch: main
      ref: 22b4c0f1088abfef6184840cb79a0a6a6aceda44
      command: echo 'Knowledge base — see README for ingest workflow'
    boundaries:
      owns: [research evidence, external references]
      not_here: [private user traces, runtime code]

  aodl:
    name: AODL
    repo: kvnloo/aodl
    kind: contract
    status: experimental
    execution: shadow
    owner: Contracts
    summary: >
      Typed intent and plan schema — contracts only, not runtime execution.
    required: false
    profiles: [full]
    depends_on: []
    integrates_with: [oh-my-pi, kerdoios]
    provides:
      - aodl.intent.v1
    consumes: []
    install:
      clone: https://github.com/kvnloo/aodl.git
      branch: main
      ref: 416736c80a727757202bdeedb02579c3c820f7f6
      command: pip install -e .
    boundaries:
      owns: [typed intent/plan contracts]
      not_here: [runtime implementation, provider execution]

  agenttrace:
    name: AgentTrace
    repo: kvnloo/agenttrace
    kind: observability
    status: experimental
    execution: log_only
    owner: Observability
    summary: >
      Historical agent TUI and span export for debugging and audit.
    required: false
    profiles: [full]
    depends_on: []
    integrates_with: [oh-my-pi, tokenomics]
    provides:
      - agenttrace.span.v0
    consumes:
      - tokenomics.event.v0
    install:
      clone: https://github.com/kvnloo/agenttrace.git
      branch: master
      ref: 6848aa10df9dae7034a7bfeaf9f51a7d55424862
      command: pip install -e .
    boundaries:
      owns: [agent span history, TUI]
      not_here: [live runtime, measurement kernel]

  memento:
    name: Memento
    repo: kvnloo/Memento
    kind: memory
    status: idea
    execution: shadow
    owner: Memory
    summary: >
      Visual private history and episodic recall (design stage).
    required: false
    profiles: []
    depends_on: [z0intelligence]
    integrates_with: [flow]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kvnloo/Memento.git
      branch: main
      ref: 513a80c2ba155115dfcea0bc808b0c41a1fd4380
      command: echo 'Not yet installable — status idea'
    boundaries:
      owns: [visual private history]
      not_here: [research KB, agent runtime]
