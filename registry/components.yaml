    required: false
    profiles: []
    depends_on: []
    integrates_with: [z0intelligence]
    provides: []
    consumes: []
    install:
      clone: https://github.com/tobi/qmd.git
      branch: main
      command: npm install -g @tobilu/qmd
    verify:
      command: qmd --help
    docs:
      readme: README.md
    bindings:
      mcp:
        command: qmd
        args: [mcp]
      harnesses: []
    evidence_source_for: [z0intelligence.context-packet]
    observed:
      at: "2026-10-22"
      host: source-only
      summary: >
        Upstream documents CLI and stdio/HTTP MCP. The inspected host snapshot
