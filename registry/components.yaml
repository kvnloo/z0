# Zer0 component registry — canonical cross-system facts.
# Implementation docs live in each repo; this file is the map.

components:
  oh-my-pi:
    name: OMP (Oh My Pi)
    repo: kvnloo/oh-my-pi
    kind: runtime
    status: canary
    execution: canary
    owner: Runtime
    summary: >
      Coding agent runtime: CLI, RPC, RLM context spill, Jev decisions,
      Handsfree HUD, Live voice, and computer-use stage manager.
    required: true
    profiles: [minimal, core, personal, desktop, compute, full]
    depends_on: []
    integrates_with: [tokenomics, z0intelligence, aodl, kerdoios, agenttrace]
    provides:
      - omp.session.aggregate
      - cu.stage_intent.v0
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
      - aodl.intent.v1
      - kerdoios.route.v1
    install:
      clone: https://github.com/kvnloo/oh-my-pi.git
      branch: rfc/interactive-performance-stack
      ref: d707478d4c5c72784c058a0163b616988f559230
      command: bun install && bun run build
    verify:
      command: bun test packages/coding-agent/test/rlm-tokenomics-bridge.test.ts
    docs:
      readme: README.md
      architecture: docs/rfc-interactive-performance-stack.md
    boundaries:
      owns: [coding agent runtime, voice/stage/CU, RLM spill, Jev hotpath]
      not_here: [token measurement, routing policy store, research KB]

  tokenomics:
    name: Tokenomics
    repo: kvnloo/tokenomics
    kind: measurement
    status: experimental
    execution: live
    owner: Measurement
    summary: >
      Vendor-neutral measurement kernel for token, cost, latency,
      and verified-task economics with reconciliation reports.
    required: false
    profiles: [core, personal, desktop, compute, research, full]
    depends_on: []
    integrates_with: [oh-my-pi, z0intelligence, kerdoios, agenttrace, flow]
    provides:
      - tokenomics.event.v0
      - tokenomics.report.v1
    consumes:
      - z0int.decision_receipt.v1
      - flow_prediction.v1
    install:
      clone: https://github.com/kvnloo/tokenomics.git
      branch: master
      ref: 65e8f2dd9d6c5784a2a1c67f5236d69a5ae94021
      command: pip install -e packages/python && npm install -w packages/typescript
    verify:
      command: tokenomics report --range today
    docs:
      architecture: packages/python/src/tokenomics/report.py
      integration: docs/MIGRATION.md
    boundaries:
      owns: [usage attribution, savings reports, reconciliation]
      not_here: [routing policy, provider execution, agent runtime]

  flow:
    name: Flow
    repo: kvnloo/.files
    kind: desktop
    status: experimental
    execution: shadow
    owner: Desktop
    summary: >
      Predictive desktop UX: context episodes, prediction horizons,
      prepare cache, and routine suggestion miner (workspace copilot).
    required: false
    profiles: [desktop, full]
    depends_on: [oh-my-pi]
    integrates_with: [tokenomics, z0intelligence]
    provides:
      - flow_prediction.v1
      - os.next_context.v0
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/.files.git
      branch: feat/workspace-copilot-flow
      ref: 5259013185d97422022fc225fa70245595b046ea
      command: echo 'Flow scripts live in scripts/workspace_flow.py — see component README'
    verify:
      command: python3 scripts/workspace_flow.py --help
    docs:
      readme: scripts/workspace_flow.py
    boundaries:
      owns: [OS prediction, prepare, routine mining]
      not_here: [agent runtime, token accounting, training loops]

  z0intelligence:
    name: z0intelligence
    repo: kvnloo/z0intelligence
    kind: intelligence
    status: experimental
    execution: log_only
    owner: Personal Intelligence
    summary: >
      Personal intelligence layer: provenance-backed context resolution,
      bounded decision backends, specialist/routine runtime, and auditable receipts.
    required: false
    profiles: [personal, research, full]
    depends_on: [tokenomics]
    integrates_with: [oh-my-pi, kerdoios, evolution-lab, tokenomics, aodl]
    provides:
      - z0int.decision_receipt.v1
      - z0int.context_resolve.v1
    consumes:
      - tokenomics.report.v1
      - flow_prediction.v1
      - aodl.intent.v1
    install:
      clone: https://github.com/kvnloo/z0intelligence.git
      branch: master
      ref: 0563ed7a52071cca63ccc91b8c9040207ad23e5d
      command: pip install -e .
    verify:
      command: python3 -m z0int --help
    boundaries:
      owns: [personal policy, provenance-backed context resolution, bounded decision backends, routine promotion, specialist runtime]
      not_here: [source memory databases, harness execution, experiment promotion, OS prediction, measurement kernel]

  kerdoios:
    name: Kerdoios
    repo: kvnloo/kerdoios
    kind: compute
    status: experimental
    execution: live
    owner: Compute
    summary: >
      Compute and provider allocation — routes work to frontier vs local
      models with cost/latency awareness.
    required: false
    profiles: [compute, full]
    depends_on: [tokenomics]
    integrates_with: [oh-my-pi, z0intelligence, aodl, tokenomics]
    provides:
      - kerdoios.route.v1
    consumes:
      - tokenomics.event.v0
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/kerdoios.git
      branch: main
      ref: cdb43b05a328a50649d5120bffcdecea09492219
      command: pip install -e .
    boundaries:
      owns: [provider routing, allocation policy]
      not_here: [provider execution, token measurement, agent runtime]

  evolution-lab:
    name: Evolution Lab
    repo: kvnloo/evolution-lab
    kind: research
    status: experimental
    execution: shadow
    owner: Research
    summary: >
      Experiment engine for locked corpora/splits, candidate evolution, DAgger,
      Pareto/MAP-Elites comparison, and verified specialist promotion.
    required: false
    profiles: [research, full]
    depends_on: [z0intelligence, tokenomics]
    integrates_with: [frontier-kb, z0intelligence]
    provides: []
    consumes:
      - tokenomics.report.v1
      - z0int.decision_receipt.v1
    install:
      clone: https://github.com/kvnloo/evolution-lab.git
      branch: trunk
      ref: 1c9b5235d341f9108d6ea4cc886592be7004ef28
      command: pip install -e .
    boundaries:
      owns: [experiment search, locked corpora and splits, candidate evolution, promotion evidence]
      not_here: [production runtime, source memory truth, personal traces]

  frontier-kb:
    name: frontier-kb
    repo: kvnloo/frontier-kb
    kind: research
    status: experimental
    execution: shadow
    owner: Research
    summary: >
      Research knowledge base: papers, external systems, hypotheses,
      and kill criteria — not private user traces.
    required: false
    profiles: [research, full]
    depends_on: []
    integrates_with: [evolution-lab]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kvnloo/frontier-kb.git
      branch: main
      ref: 22b4c0f1088abfef6184840cb79a0a6a6aceda44
      command: echo 'Knowledge base — see README for ingest workflow'
    boundaries:
      owns: [research evidence, external references]
      not_here: [private user traces, runtime code]

  aodl:
    name: AODL
    repo: kvnloo/aodl
    kind: contract
    status: experimental
    execution: shadow
    owner: Contracts
    summary: >
      Typed intent and plan schema — contracts only, not runtime execution.
    required: false
    profiles: [full]
    depends_on: []
    integrates_with: [oh-my-pi, kerdoios]
    provides:
      - aodl.intent.v1
    consumes: []
    install:
      clone: https://github.com/kvnloo/aodl.git
      branch: main
      ref: 416736c80a727757202bdeedb02579c3c820f7f6
      command: pip install -e .
    boundaries:
      owns: [typed intent/plan contracts]
      not_here: [runtime implementation, provider execution]

  agenttrace:
    name: AgentTrace
    repo: kvnloo/agenttrace
    kind: observability
    status: experimental
    execution: log_only
    owner: Observability
    summary: >
      Historical agent TUI and span export for debugging and audit.
    required: false
    profiles: [full]
    depends_on: []
    integrates_with: [oh-my-pi, tokenomics]
    provides:
      - agenttrace.span.v0
    consumes:
      - tokenomics.event.v0
    install:
      clone: https://github.com/kvnloo/agenttrace.git
      branch: master
      ref: 6848aa10df9dae7034a7bfeaf9f51a7d55424862
      command: pip install -e .
    boundaries:
      owns: [agent span history, TUI]
      not_here: [live runtime, measurement kernel]

  memento:
    name: Memento
    repo: kvnloo/Memento
    kind: sensor
    status: idea
    owner: Screen-recording recall sensor
    summary: >
      Kevin's future screen-recording recall sensor: capture, OCR and search of
      private visual history. Not enabled; not the shared runtime memory owner.
    required: false
    profiles: []
    depends_on: [z0intelligence]
    integrates_with: [flow]
    provides: []
    consumes: []
    docs:
      readme: README.md
    bindings:
      harnesses: []
    observed:
      at: "2026-10-22"
      host: groot
      summary: >
        Not enabled. The repository implements a screen-capture/timeline app;
        Kevin's ecosystem sensor integration remains an idea, not a running service.
      evidence:
        - https://github.com/kvnloo/Memento/blob/main/README.md
        - https://github.com/kvnloo/z0/issues/1
        - https://github.com/kvnloo/z0/issues/15#issuecomment-6353289693
    boundaries:
      owns: [future screen-recording recall sensor]
      not_here: [shared runtime memory, research KB, agent runtime]

  z0live:
    name: z0live
    repo: kvnloo/z0live
    kind: service
    status: experimental
    owner: Realtime interaction
    summary: >
      Realtime ConversationActor, floor, barge-in and attention behavior,
      canonical voice fixtures and actor/harness adapters.
    required: false
    profiles: []
    depends_on: [z0intelligence]
    integrates_with: [oh-my-pi, z0bridge]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kvnloo/z0live.git
      branch: main
      command: ./bin/z0live serve
    docs:
      readme: README.md
    bindings:
      harnesses: [hermes, omp]
    observed:
      at: "2026-10-22"
      host: source-only
      summary: >
        README documents portable actor/harness integration and a desktop phone
        broker. This entry does not establish a running host service or physical
        phone/audio acceptance; OMP /live product parity remains a separate gate.
      evidence:
        - https://github.com/kvnloo/z0live/blob/e1b485c40a11ab67b52b0aaf43362ac40d756fab/README.md
        - https://github.com/kvnloo/z0live/issues/32
    boundaries:
      owns: [realtime actor, floor and barge behavior, voice fixtures, interaction adapters]
      not_here: [model selection, harness effect authority, approvals]

  z0bridge:
    name: z0bridge
    repo: kvnloo/z0bridge
    kind: service
    status: experimental
    owner: Identity and session transport
    summary: >
      Shared device pairing, scoped revocable credentials, discovery and session
      transport; HTTP/SSE clients reach harness-native ACP execution.
    required: false
    profiles: []
    depends_on: []
    integrates_with: [z0live]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kvnloo/z0bridge.git
      branch: main
      command: bun install
    verify:
      command: bun src/cli.ts --help
    docs:
      readme: README.md
    bindings:
      harnesses: [hermes]
    observed:
      at: "2026-10-22"
      host: source-only
      summary: >
        README documents the Hermes ACP adapter and identity/pairing service.
        Other harness adapters are future work. Identity-only deployment and a
        NOOP consumer do not prove migration of every application; this entry
        does not assert a currently running service.
      evidence:
        - https://github.com/kvnloo/z0bridge/blob/99f513b2f3de1c9b6ce5da29de137281497488e2/README.md
        - https://github.com/kvnloo/z0bridge/issues/3
        - https://github.com/kvnloo/z0bridge/pull/2#issuecomment-6310221595
    boundaries:
      owns: [pairing, scoped credentials, discovery, session transport]
      not_here: [proxying all z0int traffic, provider keys, harness execution authority]

  oss-factory:
    name: OSS Factory
    repo: kvnloo/oss-factory
    kind: worker-coordinator
    status: experimental
    owner: Factory operations
    summary: >
      Project routing, bounded worker coordination, durable claims/handoffs and
      contribution operations using GitHub as the coordination/evidence bus.
    required: false
    profiles: []
    depends_on: []
    integrates_with: [z0intelligence, kerdoios]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kvnloo/oss-factory.git
      branch: main
    docs:
      readme: README.md
    bindings:
      harnesses: []
    observed:
      at: "2026-10-22"
      host: source-only
      summary: >
        Existing factory operations are documented; app-worker concurrency and
        durable one-turn handoffs have separate open qualification work. No MCP
        server, universal harness binding or thousand-worker readiness is claimed.
      evidence:
        - https://github.com/kvnloo/oss-factory/blob/842af1a26b4854d4e2702d175ae5b45d75877d70/README.md
        - https://github.com/kvnloo/oss-factory/issues/214
        - https://github.com/kvnloo/oss-factory/pull/215
    boundaries:
      owns: [factory operations, worker coordination, project routing, durable handoffs]
      not_here: [project implementation backlogs, semantic routing authority, new task database]

  agentsview:
    name: AgentsView
    repo: kenn-io/agentsview
    kind: memory-source
    status: experimental
    owner: Source-history archive
    summary: >
      Agent-session archive, browsing, FTS search and usage analytics. Read-only
      MCP exposes original recorded history, not current belief or authority.
    required: false
    profiles: []
    depends_on: []
    integrates_with: [z0intelligence]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kenn-io/agentsview.git
      branch: main
    verify:
      command: agentsview mcp --help
    docs:
      readme: README.md
      integration: docs/commands.md
    bindings:
      mcp:
        command: agentsview
        args: [mcp]
      harnesses: [hermes, omp, claude, codex]
    evidence_source_for: [z0intelligence.context-packet]
    observed:
      at: "2026-10-22"
      host: groot
      summary: >
        The capability snapshot records MCP configured in Hermes chiefstaff,
        OMP, Claude Code and Codex, plus an agentsview-sync timer. It does not
        prove every connection is live or establish shared-continuity acceptance.
      evidence:
        - https://github.com/kenn-io/agentsview/blob/main/README.md
        - https://github.com/kenn-io/agentsview/blob/main/docs/commands.md
        - /mnt/zer0models/workspace/zer0/data/operations/capability-matrix/20261022.md
    boundaries:
      owns: [source-history archival indexing, history retrieval, archive browsing]
      not_here: [current belief authority, shared state compiler, action authorization]

  ctx:
    name: ctx
    repo: ctxrs/ctx
    kind: memory-source
    status: experimental
    owner: Source-history retrieval
    summary: >
      Local source-history indexing, search and exact event/session hydration.
      A pull-only evidence source, not a replacement shared memory authority.
    required: false
    profiles: []
    depends_on: []
    integrates_with: [z0intelligence]
    provides: []
    consumes: []
    install:
      clone: https://github.com/ctxrs/ctx.git
      branch: main
    verify:
      command: ctx --help
    docs:
      readme: README.md
    bindings:
      mcp:
        command: ctx
        args: [mcp, serve]
      harnesses: [hermes]
    evidence_source_for: [z0intelligence.context-packet]
    observed:
      at: "2026-10-22"
      host: groot
      summary: >
        systemctl --user show reports ctx.service enabled, active/running. The
        unit runs ctx daemon run; installed ctx mcp --help documents stdio serve.
        The snapshot records MCP configured in Hermes clean and rippletern.
        This is not a universal default switch or qualified continuity result.
      evidence:
        - https://github.com/ctxrs/ctx/blob/main/README.md
        - /home/kvn/.config/systemd/user/ctx.service
        - "systemctl --user show ctx.service --property=Id,ActiveState,SubState,UnitFileState,FragmentPath (2026-10-22)"
        - "ctx mcp --help (2026-10-22)"
        - /mnt/zer0models/workspace/zer0/data/operations/capability-matrix/20261022.md
    boundaries:
      owns: [source-history search, exact hydration, provenance retrieval]
      not_here: [universal memory backend selection, automatic context push, current belief authority]

  tencentdb-memory:
    name: TencentDB Agent Memory gateway
    repo: TencentCloud/TencentDB-Agent-Memory
    kind: memory-source
    status: experimental
    owner: Memory gateway
    summary: >
      Memory Core HTTP gateway with conversation capture and derived memory;
      Hermes memory_tencentdb and an OMP native extension consume the gateway.
    required: false
    profiles: []
    depends_on: []
    integrates_with: [z0intelligence]
    provides: []
    consumes: []
    install:
      clone: https://github.com/TencentCloud/TencentDB-Agent-Memory.git
      branch: main
    verify:
      command: curl --fail --silent http://127.0.0.1:8420/health
    docs:
      readme: README.md
    bindings:
      harnesses: [hermes, omp]
      hermes:
        memory_provider: memory_tencentdb
      omp:
        extension: tencentdb-memory
    evidence_source_for: [z0intelligence.context-packet]
    observed:
      at: "2026-10-22"
      host: groot
      summary: >
        systemctl --user show reports tencentdb-memory.service enabled,
        active/running. The unit starts the local Docker gateway wrapper on
        loopback :8420. The snapshot records memory_tencentdb only in Hermes
        default/chiefstaff/memory-lab and the OMP extension; Hermes clean has no
        memory provider. Unit state does not establish useful extraction,
        embeddings, all-host connectivity or fresh shared-continuity acceptance.
      evidence:
        - https://github.com/TencentCloud/TencentDB-Agent-Memory/blob/main/README.md
        - /mnt/zer0models/z0-wt/wiring/ops/tencentdb/README.md
        - /home/kvn/.config/systemd/user/tencentdb-memory.service
        - "systemctl --user show tencentdb-memory.service --property=Id,ActiveState,SubState,UnitFileState,FragmentPath (2026-10-22)"
        - /mnt/zer0models/workspace/zer0/data/operations/capability-matrix/20261022.md
    boundaries:
      owns: [memory gateway, backend capture and retrieval, derived memory storage]
      not_here: [cross-harness continuity qualification, harness config ownership, canonical source archives]

  qmd:
    name: QMD
    repo: tobi/qmd
    kind: memory-source
    status: experimental
    owner: Docs and notes retrieval
    summary: >
      Local docs/notes retrieval with lexical, vector and reranked search;
