        Registry evidence-source intent does not promote it to a universal tier.
      evidence:
        - https://github.com/tobi/qmd/blob/main/README.md
        - https://github.com/kvnloo/z0intelligence/issues/136
        - /mnt/zer0models/workspace/zer0/data/operations/capability-matrix/20261022.md
    boundaries:
      owns: [docs and notes retrieval, local search index]
      not_here: [mandatory retrieval router, native history authority, shared state compiler]

  graphrag:
    name: Microsoft GraphRAG
    repo: kvnloo/graphrag
    kind: memory-source
