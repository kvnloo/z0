  dash:
    name: Dash
    repo: kvnloo/dash
    kind: interface
    status: canary
    execution: live
    owner: Interface
    summary: >
      Phone app plus agent bridge: a Bun/Expo client that drives the detected
      harnesses through an authenticated bridge bound to the tailnet.
    required: false
    profiles: []
    depends_on: []
    integrates_with: [oh-my-pi, z0intelligence]
    provides: []
    consumes: []
    install:
      clone: https://github.com/kvnloo/dash.git
      branch: integrate/dash-v2
      ref: 5f3ee27f6e431ba83abfe9a4a94b2c0757910ddb
      command: bun install --frozen-lockfile && bun scripts/install-public-ci.ts && bun install --frozen-lockfile --cwd bridge
    verify:
      command: bun run typecheck && bun run lint && bun run test
    boundaries:
      owns: [phone client, agent bridge, pairing]
      not_here: [harness implementation, routing policy, token accounting]
    onboard:
      gate: dash
      revs: {app: cfc08de155aed50c9f6b6f9dd8e1a4a9f25aad72, bridge: 5f3ee27f6e431ba83abfe9a4a94b2c0757910ddb}
      requires: {tools: ["bun>=1.4.3", "git", "python>=3.10"], optional: ["ffmpeg", "tailscale"]}
      hardware: {os: [linux, darwin], arch: [x86_64, arm64], min_ram_gib: 2, min_disk_gib: 5, gpu: none}
      public_ready: [revs_on_origin, no_private_on_auto_path]
      secrets:
        - {name: dash_token, kind: file, required: false}
        - {name: dash_bootstrap_token, kind: file, required: false}
      steps:
        - {id: dash.build.app, kind: build_tree, consent: {class: C0}, network: true, where: build,
           creates: ["$Z0_HOME/build/dash-app/{rev_app}"], undo: {kind: remove_owned}}
        - {id: dash.build.bridge, kind: build_tree, consent: {class: C0}, network: true, where: build,
           creates: ["$Z0_HOME/build/dash-bridge/{rev_bridge}"], undo: {kind: remove_owned}}
        - {id: dash.build.deps, kind: run, consent: {class: C0}, network: true, where: build,
           needs: [dash.build.app, toolchain.bun], argv: [bun, install, --frozen-lockfile],
           creates: ["$Z0_HOME/build/dash-app/{rev_app}/node_modules"], legacy_projection: true, timeout_s: 1800}
        - {id: dash.build.app_public, kind: run, consent: {class: C0}, network: true, where: build,
           needs: [dash.build.deps], argv: [bun, scripts/install-public-ci.ts],
           creates: ["$Z0_HOME/build/dash-app/{rev_app}/app/node_modules"], legacy_projection: true, timeout_s: 1800}
        - {id: dash.build.bridge_deps, kind: run, consent: {class: C0}, network: true, where: build,
           needs: [dash.build.deps], argv: [bun, install, --frozen-lockfile, --cwd, bridge],
           creates: ["$Z0_HOME/build/dash-app/{rev_app}/bridge/node_modules"], legacy_projection: true,
           timeout_s: 1800}
        - {id: dash.gate.typecheck, kind: check, consent: {class: C0}, where: build,
           needs: [dash.build.app_public, dash.build.bridge_deps], argv: [bun, run, typecheck], legacy_projection: true}
        - {id: dash.gate.lint, kind: check, consent: {class: C0}, where: build,
           needs: [dash.build.app_public, dash.build.bridge_deps], argv: [bun, run, lint], legacy_projection: true}
        - {id: dash.gate.test, kind: check, consent: {class: C0}, where: build,
           needs: [dash.build.app_public, dash.build.bridge_deps], argv: [bun, run, test], legacy_projection: true,
           when: [{fact: toolchains.ffmpeg.state, op: eq, value: present}]}
        - {id: dash.gate.security, kind: check, consent: {class: C0}, where: build,
           needs: [dash.build.bridge_deps],
           argv: [bun, test, bridge/src/bridge-security.test.ts, bridge/src/bridge-security-entry.test.ts,
                  bridge/src/pairing-http.test.ts]}
        - {id: dash.gate.audio, kind: check, consent: {class: C0}, where: build,
           needs: [dash.build.bridge_deps], when: [{fact: toolchains.ffmpeg.state, op: eq, value: present}],
           argv: [bun, test, bridge/src/pairing-audio.test.ts]}
        - {id: dash.release.bridge, kind: stage_release, consent: {class: C0}, where: release,
           needs: [dash.build.bridge, dash.gate.security], creates: ["~/.local/lib/dash/releases/{rev_bridge}"],
           undo: {kind: remove_owned}}
        - {id: dash.release.deps, kind: run, consent: {class: C0}, network: true, where: release,
           needs: [dash.release.bridge, toolchain.bun], argv: [bun, install, --frozen-lockfile, --cwd, bridge],
           creates: ["~/.local/lib/dash/releases/{rev_bridge}/bridge/node_modules"], timeout_s: 1800}
        - {id: dash.release.acp, kind: run, consent: {class: C0}, network: true, where: release,
           needs: [dash.release.deps], when: [{fact: derived.acp_harness, op: eq, value: true}],
           argv: [bun, install, --frozen-lockfile, --cwd, bridge/acp-adapters],
           creates: ["~/.local/lib/dash/releases/{rev_bridge}/bridge/acp-adapters/node_modules"], timeout_s: 1800}
        - {id: dash.selftest.loopback, kind: check, consent: {class: C0}, where: release,
           needs: [dash.release.deps], when: [{fact: tailscale.ipv4, op: missing}],
           verify: {serve: {argv: [bun, run, index.ts], cwd: bridge, path: /, expect_status: 401, timeout_s: 90,
                            env: {DASH_ALLOW_LOOPBACK: "1", DASH_HOST: 127.0.0.1, DASH_PORT: "@port@",
                                  DASH_CREDENTIAL_DIR: "@tmp@/credentials", DASH_CWD: "@tmp@",
                                  DASH_STT_MODEL: "@tmp@/no-model", DASH_ENABLE_LEGACY_CLI: "0"}}}}
        - {id: dash.bridge.env, kind: write_file, consent: {class: C1, bundle: services}, where: home,
           target_where: release, needs: [dash.release.deps], when: [{fact: tailscale.ipv4, op: exists}],
           creates: ["~/.config/dash-services/bridge.env"], undo: {kind: restore_backup}}
        - {id: dash.bridge.wait_tailnet, kind: write_file, consent: {class: C1, bundle: services}, where: home,
           needs: [dash.release.deps], when: [{fact: tailscale.ipv4, op: exists}],
           creates: ["~/.local/lib/dash/bin/dash-wait-tailnet"], undo: {kind: remove_owned}}
        - {id: dash.bridge.unit, kind: service_unit, consent: {class: C1, bundle: services}, where: release,
           needs: [dash.bridge.env, dash.bridge.wait_tailnet],
           when: [{fact: session.systemd_user, op: eq, value: true}],
           service: {template: dash-bridge, unit: dash-bridge.service, bind: tailnet_ipv4, port: 4747,
                     health: {http: {bind: tailnet_ipv4, port: 4747, path: /, expect_status: 401}},
                     start_order: 10, limits: {memory_max: 1G, restart_sec: 10, timeout_start_sec: 120}},
           probe: {exists: "~/.config/systemd/user/dash-bridge.service"}, undo: {kind: restore_backup}}
        - {id: dash.bridge.current, kind: swap_current, consent: {class: C1, bundle: services}, where: release,
           needs: [dash.bridge.unit], creates: ["~/.local/lib/dash/bridge-current"],
           undo: {kind: restore_symlink}}
        - {id: dash.health, kind: check, consent: {class: C0}, needs: [dash.bridge.current],
           verify: {http: {bind: tailnet_ipv4, port: 4747, path: /, expect_status: 401}}}
        - {id: dash.apk, kind: ask, consent: {class: C0},
           argv: [echo, "Android dev-client APK build is C2 (scripts/build-native-android.sh)"]}
      acceptance:
        tiers:
          - {name: static, checks: [dash.gate.typecheck, dash.gate.lint, dash.gate.test, dash.gate.security, dash.gate.audio]}
          - {name: live, checks: [dash.health]}
      remediations: [use_public_install, mark_unavailable]

