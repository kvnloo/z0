        tiers:
          - {name: tier0, checks: [z0evals.t0.rollout, z0evals.t0.pages_map, z0evals.t0.arm_identity, z0evals.t0.expire_claims]}
          - {name: tier1, checks: [z0evals.t1.pages, z0evals.t1.validate, z0evals.t1.expire_claims, z0evals.t1.optchat_validate, z0evals.t1.optchat_tests, z0evals.t1.audit_source, z0evals.t1.posts_tests]}
          - {name: tier2, checks: [z0evals.web.typecheck, z0evals.web.audit]}
      remediations: [skip_web_tier_offline, mark_unavailable]
