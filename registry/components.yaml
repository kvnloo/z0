        - {id: z0evals.deps, kind: pip_install, consent: {class: C0}, network: true, where: venv,
           needs: [z0evals.venv], argv: [.venv/bin/pip, install, -r, requirements.txt],
           probe: {exists: "{tree}/.venv/.z0/requirements-{pin}"}, legacy_projection: true}
        - {id: z0evals.t1.pages, kind: check, consent: {class: C0}, where: build, needs: [z0evals.deps],
           argv: [.venv/bin/python, -m, unittest, tests/test_pages_publication.py]}
        - {id: z0evals.t1.validate, kind: check, consent: {class: C0}, where: build, needs: [z0evals.deps],
           argv: [.venv/bin/python, scripts/validate.py], legacy_projection: true}
        - {id: z0evals.t1.expire_claims, kind: check, consent: {class: C0}, where: build, needs: [z0evals.deps],
           argv: [.venv/bin/python, tests/expire_claims.py]}
        - {id: z0evals.t1.optchat_validate, kind: check, consent: {class: C0}, where: build, needs: [z0evals.deps],
           argv: [.venv/bin/python, scripts/validate_optchat_publication.py]}
        - {id: z0evals.t1.optchat_tests, kind: check, consent: {class: C0}, where: build, needs: [z0evals.deps],
           argv: [.venv/bin/python, -m, unittest, tests/test_optchat_publication.py]}
        - {id: z0evals.t1.audit_source, kind: check, consent: {class: C0}, where: build, needs: [z0evals.deps],
           argv: [.venv/bin/python, scripts/audit_web_source.py]}
        - {id: z0evals.t1.build_site, kind: run, consent: {class: C0}, where: build, needs: [z0evals.deps],
           argv: [.venv/bin/python, scripts/build_site.py], creates: ["{tree}/site/index.html"]}
        - {id: z0evals.t1.site_data, kind: run, consent: {class: C0}, where: build, needs: [z0evals.t1.build_site],
           argv: [.venv/bin/python, scripts/build_site_data.py],
           creates: ["{tree}/web/data/optchat-long-horizon-v0.json"]}
        - {id: z0evals.t1.posts, kind: run, consent: {class: C0}, where: build, needs: [z0evals.t1.site_data],
           argv: [.venv/bin/python, scripts/build_posts.py], creates: ["{tree}/web/data/posts"]}
        - {id: z0evals.t1.posts_tests, kind: check, consent: {class: C0}, where: build, needs: [z0evals.t1.posts],
           argv: [.venv/bin/python, -m, unittest, tests/test_build_posts.py]}
        - {id: z0evals.web.gate, kind: check, consent: {class: C0}, needs: [z0evals.t1.posts, toolchain.node],
           when: [{fact: network.fonts_google, op: eq, value: true}, {fact: network.npmjs, op: eq, value: true}],
           argv: [node, --version]}
        - {id: z0evals.web.deps, kind: run, consent: {class: C0}, network: true, where: build,
           needs: [z0evals.web.gate], argv: [npm, ci, --no-audit, --no-fund, --prefix, web],
           creates: ["{tree}/web/node_modules"], timeout_s: 1800}
        - {id: z0evals.web.typecheck, kind: check, consent: {class: C0}, where: build, needs: [z0evals.web.deps],
           argv: [npm, --prefix, web, run, typecheck]}
        - {id: z0evals.web.build, kind: run, consent: {class: C0}, network: true, where: build,
           needs: [z0evals.web.typecheck], argv: [npm, --prefix, web, run, build],
           env: {Z0_BASE_PATH: /z0evals}, creates: ["{tree}/web/out/index.html"], timeout_s: 1800}
        - {id: z0evals.web.audit, kind: check, consent: {class: C0}, where: build, needs: [z0evals.web.build],
           argv: [.venv/bin/python, scripts/audit_web_export.py, --root, web/out]}
        - {id: z0evals.post.status, kind: check, consent: {class: C0}, where: build, needs: [z0evals.t1.posts],
           argv: [git, --no-optional-locks, status, --porcelain]}
        - {id: z0evals.ask.claude_md, kind: ask, consent: {class: C0},
           when: [{fact: harnesses.claude_code.state, op: eq, value: installed}],
           argv: [echo, "CLAUDE.md pointer to AGENTS.md (the repo discourages duplicate instruction files)"]}
        - {id: z0evals.ask.kit_skills, kind: ask, consent: {class: C0},
           argv: [echo, "link .verified-oss-loop/skills into your harness skill dir"]}
        - {id: z0evals.ask.visual_probes, kind: ask, consent: {class: C0},
           argv: [echo, "visual-parity probes (web/docs/probes) need a Chromium path and websockets"]}
