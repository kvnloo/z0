        - {id: z0evals.t0.rollout, kind: check, consent: {class: C0}, where: build, needs: [z0evals.source],
           argv: [python3, .verified-oss-loop/rollout.py, show]}
        - {id: z0evals.t0.pages_map, kind: check, consent: {class: C0}, where: build, needs: [z0evals.source],
