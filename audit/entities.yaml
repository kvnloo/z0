  # services) and shares ZERO ids with this registry. Nothing in the current
  # stack consumes it; the split stalled on 2026-07-26.
  #
  # Declared here as well as in `registry/upstreams.yaml` because the registry
  # and the swept universe must name the same entities -- `registry-check` fails
  # in both directions if they drift.

