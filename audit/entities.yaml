# Declared universe for the current-state reality sweep.
#
# This file states WHICH entities belong to the Zer0 network and what each one
# is expected to be. It deliberately does NOT state current branch/HEAD/PR
# facts: those are observed by `scripts/reality-sweep` and written to
# `audit/reality-ledger.json`, so this file cannot drift from the repos.
#
# kind:
#   owned_component   a Zer0-owned surface with its own semantic responsibility
#   upstream_system   an external system Zer0 depends on or executes through
#   catalog_source    an authority Zer0 must DISCOVER facts from, never recopy
#   interaction_surface  a human/agent-facing surface, not an executor
#   legacy_or_donor   superseded, donor-only, or research provenance
#   reference_only    named for context; no dependency or adapter claimed
#
# relationship (to the network, not to z0 the repo):
#   owned | executes_via | consumes_contract | emits_contract | discovers_from
#   | governed_by | measured_by | evaluated_by | publishes_evidence_to
#   | provides_research_evidence | legacy_of | reference_to
#
# expected_status is an ASSERTION to be checked against observed reality.
# Mismatch between expected_status and observed status is a finding, not a fix.

entities:
  # ---- registry / architecture -------------------------------------------
  - id: z0
    kind: owned_component
    repo: kvnloo/z0
    plane: architecture
    owns: [registry truth, profiles, generated architecture, install matrix, onboarding]
    not_here: [runtime execution, model/provider catalogs, telemetry semantics]
    expected_status: merged
    capability_ref: {kind: default}

  - id: z0archy
    kind: owned_component
    repo: kvnloo/z0archy
    plane: architecture
    owns: [architecture visualization of the typed registry graph]
    not_here: [registry truth]
    expected_status: unknown
    capability_ref: {kind: default}

  # ---- contracts ----------------------------------------------------------
  - id: aodl
    kind: owned_component
    repo: kvnloo/aodl
    plane: contracts
    owns: [typed intent IR, compiled plan, observed state, harness catalog, fail-closed validation]
    not_here: [model selection, routing policy, provider catalogs]
    relationship: governed_by
    expected_status: merged
    capability_ref: {kind: default}

  # ---- cognition ----------------------------------------------------------
  - id: z0intelligence
    kind: owned_component
    repo: kvnloo/z0intelligence
    plane: cognition
    owns: [semantic model selection, escalation, context resolution, DecisionBackend,
           local SLM portfolio, JEV/NanoJev/OpenJev contracts, cognition receipts,
           promotion activation into shadow/canary/active]
    not_here: [daily provider quota accounting, GPU placement, token measurement]
    expected_status: merged
    capability_ref: {kind: default}
    note: >
      The GitHub repo kvnloo/openjev redirects here; the old registry listed
      `openjev` as an independent component with repo kvnloo/openjev.

  - id: openjev
    kind: legacy_or_donor
    repo: kvnloo/openjev
    plane: cognition
    owns: []
    not_here: [independent decision ownership]
    relationship: legacy_of
    legacy_of: z0intelligence
    expected_status: superseded
    capability_ref: {kind: superseded, superseded_by: kvnloo/z0intelligence}
    note: "Repo renamed to kvnloo/z0intelligence; retained only as alias provenance."

  - id: NanoJev
    kind: upstream_system
    repo: kvnloo/NanoJev
    plane: cognition
    relationship: reference_to
    expected_status: unknown
    capability_ref: {kind: external}
    note: "Fork; JEV-family implementation used behind z0int decision contracts."

  - id: laya
    kind: upstream_system
